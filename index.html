/* Fincanı aç: önce yapay zekâ denenir, tutmazsa cihazdaki motor okur.
   Kullanıcı bu ayrımı görmez; her iki durumda da aynı ekran gelir.   */
let sonAiVeri = null;
let sonOlcum = null;   // eğitim verisi için son ölçüm dökümü
let sonSoru = null;

/* Fotoğraf TEPEDEN çekiliyor: fincanın ağzı dıştaki halka, dibi
   ortadaki noktadır. Halkanın gideceği yerler buna göre.        */
const RITUAL_BOLGE = {
  hepsi: [50, 50, 47],
  kenar: [50, 50, 44],
  orta:  [50, 50, 27],
  dip:   [50, 50, 13],
  kulp:  [72, 50, 20],
  karsi: [28, 50, 20],
  sag:   [50, 28, 20],
  sol:   [50, 72, 20]
};

async function falAc(){
  if(!shots.length){ toast(P().ui.needOne); return; }
  const T = P();
  go("ritual");
  const line = document.getElementById("ritual-line");
  /* Yazılar tekrar etmesin. Açılış ve kapanış yerinde durur, ortadaki
     satırlar her falda başka sırayla gelir. Söylenen yer fotoğrafın
     üstünde de gösterilir: dediğimiz şeyi görüyor.                */
  const RLh = (T.ritual || []).slice();
  const RZh = (T.ritualBolge || []).slice();
  const dizin = RLh.map((_, q) => q);
  for(let q=dizin.length-2; q>1; q--){
    const w = 1 + Math.floor(Math.random()*q);
    const t = dizin[q]; dizin[q] = dizin[w]; dizin[w] = t;
  }
  const RL = dizin.map(q => RLh[q]);
  const RZ = dizin.map(q => RZh[q] || "hepsi");

  /* fincanı ritüel ekranına koy */
  const goz = document.getElementById("ritual-goz");
  const fotoEl = document.getElementById("ritual-foto");
  if(goz && fotoEl && shots.length && shots[0].url){
    fotoEl.style.backgroundImage = "url(" + shots[0].url + ")";
    goz.classList.remove("bos");
  } else if(goz) goz.classList.add("bos");

  const halka = document.getElementById("ritual-halka");
  const odakla = ad => {
    if(!halka) return;
    const B = RITUAL_BOLGE[ad] || RITUAL_BOLGE.hepsi;
    halka.setAttribute("cx", B[0]);
    halka.setAttribute("cy", B[1]);
    halka.setAttribute("r",  B[2]);
  };

  let i = 0;
  line.textContent = RL[0] || "";
  odakla(RZ[0]);
  const tick = setInterval(()=>{
    if(i < RL.length - 1){ i++; line.textContent = RL[i]; odakla(RZ[i]); }
  }, 2600);

  /* Geri sayım: kullanıcı ne kadar bekleyeceğini görsün. */
  const kalanEl = document.getElementById("ritual-kalan");
  const tahmin = aiMumkun() ? 45 : 4;
  let kalan = tahmin;
  const yazKalan = () => {
    if(!kalanEl) return;
    kalanEl.textContent = kalan > 0
      ? (T.ui.kalanSure ? T.ui.kalanSure(kalan) : kalan + " sn")
      : (T.ui.nerdeyseBitti || "");
  };
  yazKalan();
  const sayac = setInterval(()=>{ if(kalan > 0) kalan--; yazKalan(); }, 1000);
  const enAz = new Promise(r => setTimeout(r, aiMumkun() ? 2600 : 2200));

  let veri = null;
  /* Ölçüm dökümünü her hâlükârda çıkarıyoruz: yapay zekâ kapalıyken de
     eğitim örneği dışa aktarılabilsin diye. Modeli eğitecek veri,
     okumanın yapay zekâyla yapılmasına bağlı değil.                  */
  const cvs = [], sirali = [];
  for(const sh of shots){
    const cv = cupCanvas(sh, 1024);
    if(cv){ sh._kes = cv._kes; cvs.push(cv); sirali.push(sh); }
  }
  let dokum = [], parcalar = [];
  sirali.forEach((sh, i)=>{
    dokum = dokum.concat(lekeDokumu(sh, i+1, T));
    parcalar = parcalar.concat(parcaDokumu(sh, i+1));
  });
  sonOlcum = cvs.length
    ? {foto:cvs.length, kulp:handle, dil:T.loc, olcumler:dokum, figurler:parcalar}
    : null;

  try{
    if(aiMumkun()){
      if(cvs.length){
        /* cihazın ölçtüğü lekeleri de veriyoruz: yorum somutlaşıyor ve
           işaretlenen kutular gerçekten lekenin üstüne oturuyor */
        const soru = T.aiSoru({
          foto: cvs.length,
          ad: KULLANICI_ADI || T.adYedek,
          kulp: T.yonAd[handle] || handle,
          eksik: cvs.length < 3,
          dokum: dokumMetni(dokum, T),
          parca: parcaMetni(parcalar),
          gecmis: gecmisMetni()
        });
        sonSoru = soru;
        const ham = await Promise.race([
          aiOku(soru, cvs),
          new Promise(r => setTimeout(()=>r(null), 75000))
        ]);
        veri = aiTemizle(ham, shots.length);
      }
    }
  }catch(err){ veri = null; }

  await enAz;
  clearInterval(tick);
  clearInterval(sayac);
  if(kalanEl) kalanEl.textContent = "";
  try{
    sonAiVeri = veri;
    if(!(veri && buildPagesAI(veri))){ sonAiVeri = null; buildPages(); }
    if(!pages.length) throw new Error("sayfa yok");
    go("read");
    sizeStage();
    showPage(0);
    if(!rafId) loop();
    gecmisKaydet();
    if(sesIster()) sesBaslat(); else sesDugmeYaz();
  }catch(err){
    console.error(err);
    sonAiVeri = null;
    try{
      buildPages();
      if(!pages.length) throw err;
      go("read"); sizeStage(); showPage(0);
      if(!rafId) loop();
    }catch(e2){
      go("setup");
      toast(P().ui.badRead);
    }
  }
}
function gecmisKaydet(){
  const adlar = pages.filter(p => p.kind === "sym")
                     .map(p => p.title.replace(/<[^>]+>/g, "").toLocaleLowerCase(P().loc))
                     .filter(Boolean);
  const kapak = pages.length ? pages[0].title.replace(/<[^>]+>/g, "") : "";
  gecmisYaz(adlar, kapak);
}

  if(hangi) yasalSekme = hangi;
  else oncekiEkran = hangiEkran();
  const y = T.yasal;
  document.getElementById("legal-kicker").textContent = T.ui.kicker;
  document.getElementById("legal-title").textContent =
    yasalSekme === "kosullar" ? y.kosulBaslik : y.gizlilikBaslik;
  document.getElementById("legal-date").textContent = y.guncel;
  belgeYaz("legal-body", yasalSekme === "kosullar" ? y.kosullar : y.gizlilik);
  document.querySelectorAll("[data-doc]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.doc === yasalSekme)));
  go("legal");
}

/* ══════════════════ EĞİTİM VERİSİ ══════════════════
   Uygulama kullanıldıkça kendi eğitim kümesini biriktirir. Her okuma
   bir çift üretir: girdi olarak cihazın ölçtüğü lekeler, hedef olarak
   o fincan için yazılan fal. Yapay zekâ okuması yapıldıysa hedef hazır
   gelir; yapılmadıysa yalnız ölçümler çıkar ve hedefi sonradan
   yazarsın. Küçük bir modeli LoRA ile eğitmek için gereken biçim budur. */
function egitimCifti(){
  if(!sonOlcum) return null;
  return {
    surum: 1,
    tarih: new Date().toISOString().slice(0,10),
    dil: sonOlcum.dil,
    girdi: {
      foto: sonOlcum.foto,
      kulp: sonOlcum.kulp,
      ad: KULLANICI_ADI || "",
      olcumler: sonOlcum.olcumler
    },
    hedef: sonAiVeri || null,
    kaynak: sonAiVeri ? "yapay-zeka" : "elle-yazilacak"
  };
}

function veriMetni(){
  const c = egitimCifti();
  return c ? JSON.stringify(c, null, 2) : "";
}

document.getElementById("b-veri-kopya").addEventListener("click", ()=>{
  const m = veriMetni();
  if(!m){ toast(P().ui.veriYok); return; }
  navigator.clipboard.writeText(m).then(
    ()=>toast(P().ui.veriKopyalandi),
    ()=>toast(P().ui.copyFail)
  );
});

document.getElementById("b-veri-indir").addEventListener("click", async ()=>{
  const m = veriMetni();
  if(!m){ toast(P().ui.veriYok); return; }
  const ad = "fincan-ornek-" + Date.now() + ".json";

  /* claude.ai görüntüleyicisinde sıradan indirme bağlantısı çalışmaz;
     dosyayı kullanıcıya oranın kendi indirme yolundan veriyoruz.     */
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const d = await window.claude.use("downloads");
      if(d){ await d.save({filename:ad, data:m}); return; }
    }
  }catch(err){ /* reddedildi ya da yok: alttaki yola düş */ }

  try{
    const b = new Blob([m], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = ad;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }catch(err){ toast(P().ui.copyFail); }
});

/* ══════════════════ 8. ÖRNEK FİNCAN ══════════════════ */

function makeSample(){
  const c = document.createElement("canvas");
  c.width = 600; c.height = 600;
  const x = c.getContext("2d");
  let s = 20250912;
  const r = ()=>{ s = (s*1103515245 + 12345) & 0x7fffffff; return s/0x7fffffff; };

  x.fillStyle = "#2A1D18"; x.fillRect(0,0,600,600);
  const g = x.createRadialGradient(300,270,40,300,300,290);
  g.addColorStop(0,"#FFFFFF"); g.addColorStop(.7,"#F2ECE6"); g.addColorStop(1,"#D9CEC4");
  x.fillStyle = g;
  x.beginPath(); x.arc(300,300,272,0,7); x.fill();

  const ink = "rgba(58,34,22,.93)";
  function smear(px,py,len,ang,wid){
    x.strokeStyle = ink; x.lineCap = "round";
    let cx=px, cy=py, a=ang;
    for(let i=0;i<len;i+=3){
      a += (r()-.5)*0.13;
      const nx = cx+Math.cos(a)*3, ny = cy+Math.sin(a)*3;
      x.lineWidth = wid*(0.75+r()*0.5);
      x.beginPath(); x.moveTo(cx,cy); x.lineTo(nx,ny); x.stroke();
      cx=nx; cy=ny;
    }
    return [cx,cy];
  }
  // ikiye ayrılan yol
  const [fx,fy] = smear(250,470,110,-Math.PI/2+0.12,9);
  smear(fx,fy,105,-Math.PI/2-0.52,7);
  smear(fx,fy,100,-Math.PI/2+0.56,7);
  // dağ
  x.fillStyle = ink; x.beginPath();
  x.moveTo(430,300); x.lineTo(372,398); x.lineTo(492,398); x.closePath(); x.fill();
  for(let i=0;i<70;i++){ x.beginPath(); x.arc(372+r()*120, 380+r()*24, 2+r()*4, 0, 7); x.fill(); }
  // yüzük
  x.strokeStyle = ink; x.lineWidth = 11;
  x.beginPath(); x.arc(190,215,27,0,7); x.stroke();
  // bereket benekleri
  for(let i=0;i<16;i++){ x.beginPath(); x.arc(360+r()*90, 150+r()*70, 4+r()*4, 0, 7); x.fill(); }
  // harfe benzer iz
  x.lineWidth = 9; x.beginPath();
  x.moveTo(150,360); x.lineTo(150,420); x.lineTo(196,360); x.lineTo(196,420); x.stroke();
  // doku
  for(let i=0;i<2600;i++){
    const a = r()*7, rad = Math.sqrt(r())*268;
    x.fillStyle = "rgba(70,44,30,"+(0.05+r()*0.2)+")";
    x.beginPath(); x.arc(300+Math.cos(a)*rad, 300+Math.sin(a)*rad, r()*2.4, 0, 7); x.fill();
  }
  return c.toDataURL("image/jpeg", 0.92);
}
