/* ══════ cihazın ölçtükleri ══════
   Yapay zekâya yalnız fotoğrafı vermek yetmiyor: "şurada koyu bir küme
   var" diyor ama nerede olduğunu tam söyleyemiyor ve her fala benzer
   şeyler yazıyor. Cihazdaki motor lekeleri zaten ölçüyor; bu ölçümleri
   yanına koyunca yorum bu fincana özgü ve somut çıkıyor, işaretlediği
   kutular da gerçekten lekenin üstüne oturuyor.                       */
function lekeDokumu(shot, sira, T){
  const k = shot._kes;
  if(!k) return [];
  const wx0 = k.x0/k.kay, wy0 = k.y0/k.kay, ww = k.w/k.kay, wh = k.h/k.kay;
  const C = shot.cup;
  const g = shot.gray, W = shot.work.w;
  const koyuluk = b => {
    let t = 0, n = 0;
    for(let y=0;y<b.bh;y++) for(let x=0;x<b.bw;x++){
      if(!b.mask[y*b.bw+x]) continue;
      const i = (b.y0+y)*W + (b.x0+x);
      if(i>=0 && i<g.length){ t += g[i]; n++; }
    }
    return n ? Math.max(1, Math.min(10, Math.round((255 - t/n)/25.5))) : 5;
  };
  /* Belirginlik: koyuluk çarpı büyüklük. Silik ve ufak izler sona
     düşsün, hatta hiç gitmesin; falcı önce göze çarpanı okur.     */
  const puanla = b => {
    const k = koyuluk(b);
    const alan = b.area/Math.max(1, C.area);
    return k * Math.sqrt(alan);
  };
  const aday = shot.blobs.filter(b => !b.ak)
    .map(b => ({b, puan: puanla(b) * (b.ton === "orta" ? 0.55 : 1)}))
    .sort((x,y) => y.puan - x.puan);
  /* en belirgine göre çok sönük kalanları hiç gönderme */
  const enIyi = aday.length ? aday[0].puan : 0;
  return aday
    .filter(o => o.puan >= enIyi*0.28)
    .slice(0, 8)
    .map(o => o.b)
    .map(b => {
      const p = place(b);
      const nx = (b.cx - wx0)/Math.max(1, ww), ny = (b.cy - wy0)/Math.max(1, wh);
      const rx = (b.bw/2)/Math.max(1, ww),     ry = (b.bh/2)/Math.max(1, wh);
      const yuzde = (b.area/Math.max(1, C.area)*100);
      return {
        foto: sira,
        kutu: [Math.max(0,nx-rx), Math.max(0,ny-ry), Math.min(1,nx+rx), Math.min(1,ny+ry)]
                .map(v => Math.round(v*100)/100),
        yuzde: Math.round(yuzde*10)/10,
        koyu: koyuluk(b),
        uzun: Math.round(b.elong*10)/10,
        bolge: p.zone,
        yon: p.side
      };
    });
}
/* lekenin içinde bulunan figürler: kutu lekenin tamamını değil,
   figürün kendisini sarar. Yapay zekâ bunları doğrudan kullanır. */
function parcaDokumu(shot, sira){
  const k = shot._kes;
  if(!k || !shot.parcalar) return [];
  const wx0 = k.x0/k.kay, wy0 = k.y0/k.kay, ww = k.w/k.kay, wh = k.h/k.kay;
  return shot.parcalar.map(p => ({
    foto: sira,
    benzer: p.ad,
    guven: Math.round(p.score*100),
    kutu: [ (p.x0 - wx0)/Math.max(1,ww), (p.y0 - wy0)/Math.max(1,wh),
            (p.x0 + p.bw - wx0)/Math.max(1,ww), (p.y0 + p.bh - wy0)/Math.max(1,wh) ]
          .map(v => Math.round(Math.max(0, Math.min(1, v))*100)/100)
  }));
}
function parcaMetni(liste){
  if(!liste.length) return "";
  return liste.map(function(d, i){
    return "  " + (i+1) + ") foto " + d.foto + ", kutu [" + d.kutu.join(", ") + "]"

/* ══════ fincanın içini kes: dışarısı siyah ══════ */
function cupCanvas(shot, enBuyuk){
  const img = shot.img;
  const kay = img ? (img.width / shot.work.w) : 1;      // orijinale ölçek
  const kaynak = img || shot.work.canvas;
  const c = shot.cup;
  const cx = c.cx*kay, cy = c.cy*kay, rx = c.rx*kay, ry = c.ry*kay;
  const gw = kaynak.width, gh = kaynak.height;
  const x0 = Math.max(0, cx-rx), y0 = Math.max(0, cy-ry);
  const w  = Math.min(gw, cx+rx) - x0, h = Math.min(gh, cy+ry) - y0;
  if(w < 8 || h < 8) return null;
  const s = Math.min(1, (enBuyuk || 768)/Math.max(w,h));
  const cv = document.createElement("canvas");
  cv.width = Math.max(8, Math.round(w*s));
  cv.height = Math.max(8, Math.round(h*s));
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse((cx-x0)*s, (cy-y0)*s, rx*s*0.985, ry*s*0.985, 0, 0, Math.PI*2);
  ctx.clip();
  ctx.drawImage(kaynak, x0, y0, w, h, 0, 0, cv.width, cv.height);
  ctx.restore();
  /* kutuları geri çevirebilmek için kesim bilgisi */
  cv._kes = {x0, y0, w, h, kay};
  return cv;
}
function cupBlob(cv){
  return new Promise(res=>{
    try{ cv.toBlob(b=>res(b), "image/jpeg", 0.85); }catch(e){ res(null); }
  });
}
const cupB64 = cv => cv.toDataURL("image/jpeg", 0.85).split(",")[1];

/* ══════ JSON ayıklama ══════ */
function aiJson(metin){
  if(!metin) return null;
  let s = String(metin).trim();
  s = s.replace(/^```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a < 0 || b <= a) return null;
  try{ return JSON.parse(s.slice(a, b+1)); }
  catch(e){
    try{ return JSON.parse(s.slice(a, b+1).replace(/,\s*([}\]])/g, "$1")); }
    catch(e2){ return null; }
  }
}

/* ══════ sağlayıcı çağrıları ══════ */
async function cagirGemini(k, model, soru, gorseller){
  const parts = [{text:soru}];
  for(const g of gorseller) parts.push({inline_data:{mime_type:"image/jpeg", data:g}});
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(k), {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      contents:[{role:"user", parts}],
      generationConfig:{temperature:1.0, topP:0.95, maxOutputTokens:8192, responseMimeType:"application/json"}
    })
  });
  if(!r.ok) throw new Error("gemini "+r.status);
  const j = await r.json();
  const c = j && j.candidates && j.candidates[0];
  const p = c && c.content && c.content.parts || [];
  return p.map(x=>x.text||"").join("");
}

async function cagirOpenAIUyumlu(url, k, model, soru, gorseller, ek){
  const icerik = [{type:"text", text:soru}];
  for(const g of gorseller)
    icerik.push({type:"image_url", image_url:{url:"data:image/jpeg;base64,"+g}});
  const bas = {"Content-Type":"application/json", "Authorization":"Bearer "+k};
  if(ek) Object.assign(bas, ek);
  const r = await fetch(url, {
    method:"POST", headers:bas,
    body: JSON.stringify({
      model, temperature:1.0, max_tokens:8000,
      response_format:{type:"json_object"},
      messages:[{role:"user", content:icerik}]
    })
  });
  if(!r.ok) throw new Error("api "+r.status);
  const j = await r.json();
  return j && j.choices && j.choices[0] && j.choices[0].message
       ? (j.choices[0].message.content || "") : "";
}

/* ══════ ana giriş: fincanı yapay zekâya okut ══════ */
async function aiOku(soru, canvaslar){
  if(AI_AYAR.kapali) return null;

  /* 1) claude.ai görüntüleyicisi */
  const sp = await aiSample();
  if(sp){
    try{
      const lim = await sp.limits().catch(()=>null);
      /* Görsel gönderilemiyorsa bu yolu hiç kullanmıyoruz: fincanı
         görmeden yazılan yorum uydurma olur.                        */
      if(lim && lim.images){
        const gorsel = [];
        const enFazla = Math.max(1, lim.images.maxCount || 1);
        for(const cv of canvaslar.slice(0, enFazla)){
          const b = await cupBlob(cv);
          if(b) gorsel.push(b);
        }
        if(gorsel.length){
          const j = await sp.json(soru, {images:gorsel, modelTier:"complex"});
          if(j && typeof j === "object") return j;
        }
      }
    }catch(e){ /* sessizce alt yola geç */ }
  }

  /* 2) kendi sunucumuz (anahtar orada durur) */
  const b64 = canvaslar.slice(0,3).map(cupB64);
  if(await vekilVarMi()){
    try{
      const j = aiJson(await cagirVekil(soru, b64));
      if(j) return j;
    }catch(e){ /* sıradaki yola geç */ }
  }

  /* 3) sayfaya gömülü anahtar */
  const k = aiAnahtar();
  const sag = aiSaglayici(k);
  if(!sag) return null;
  const modeller = AI_AYAR.model ? [AI_AYAR.model] : AI_MODEL[sag];
  for(const m of modeller){
    try{
      let ham = "";
      if(sag === "gemini")          ham = await cagirGemini(k, m, soru, b64);
      else if(sag === "groq")       ham = await cagirOpenAIUyumlu("https://api.groq.com/openai/v1/chat/completions", k, m, soru, b64);
      else                          ham = await cagirOpenAIUyumlu("https://openrouter.ai/api/v1/chat/completions", k, m, soru, b64,
                                          {"HTTP-Referer":location.origin || "https://fincan.app", "X-Title":"Fincan"});
      const j = aiJson(ham);
      if(j) return j;
    }catch(e){ /* sıradaki modeli dene */ }
  }
  return null;
}

/* ══════ gelen cevabı temizle ══════ */
function aiTemizle(j, fotoSayisi){
  if(!j || typeof j !== "object") return null;
  /* Gelen metin doğrudan sayfaya basılıyor: içindeki her türlü işaretleme
     etkisiz hâle getirilir. Yapay zekâ çıktısı güvenilmez girdidir.   */
  const yazi = v => (typeof v === "string" && v.trim())
    ? v.trim().split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;")
    : "";
  const kutu = v => {
    if(!Array.isArray(v) || v.length < 4) return null;
    const n = v.map(x => Math.max(0, Math.min(1, Number(x) || 0)));
    let [a,b,c,d] = n;
    if(c < a){ const t=a; a=c; c=t; }
    if(d < b){ const t=b; b=d; d=t; }
    if(c-a < 0.02) { a = Math.max(0,a-0.03); c = Math.min(1,c+0.03); }
    if(d-b < 0.02) { b = Math.max(0,b-0.03); d = Math.min(1,d+0.03); }
    return [a,b,c,d];
  };
  const foto = v => {
    const n = Math.round(Number(v) || 1);
    return Math.max(0, Math.min(fotoSayisi-1, n-1));
  };
  const bol = v => ["kenar","orta","dip"].indexOf(v) >= 0 ? v : "orta";
  const yon = v => ["yakin","karsi","yan"].indexOf(v) >= 0 ? v : "yan";
  const guv = v => {
    const n = Number(v);
    return (isFinite(n) && n > 0) ? Math.max(0.05, Math.min(0.99, n > 1 ? n/100 : n)) : 0.55;
  };

  const sekiller = (Array.isArray(j.sekiller) ? j.sekiller : [])
    .map(s => s && typeof s === "object" ? {
      ad: yazi(s.ad),
      kesin: s.kesin === true || s.kesin === "true",
      guven: guv(s.guven),
      foto: foto(s.foto),
      kutu: kutu(s.kutu),
      bolge: bol(s.bolge),
      yon: yon(s.yon),
      gordugum: yazi(s.gordugum),
      yorum: yazi(s.yorum),
      ogret: yazi(s.ogret),
      tahmin: yazi(s.tahmin)
    } : null)
    .filter(s => s && s.ad && s.yorum);

  /* Aynı lekeye iki ayrı ad verilmesin. Kutular birbirini yarıdan
     fazla örtüyorsa ikincisi elenir; fincanın aynı yerini iki kez
     göstermek okuyanı "bunu demin konuşmadık mı" dedirtir.        */
  const ortusme = (a, b) => {
    if(!a || !b) return 0;
    const gx = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0]));
    const gy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    const kesisim = gx*gy;
    const ka = (a[2]-a[0])*(a[3]-a[1]), kb = (b[2]-b[0])*(b[3]-b[1]);
    return kesisim / Math.max(1e-6, Math.min(ka, kb));
  };
  const ayik = [];
  for(const s of sekiller){
    if(!s.kutu){ ayik.push(s); continue; }
    let cakisan = false;
    for(const v of ayik){
      if(v.kutu && ortusme(s.kutu, v.kutu) > 0.22){ cakisan = true; break; }
    }
    if(!cakisan) ayik.push(s);
    if(ayik.length >= 16) break;
  }
  sekiller.length = 0;
  for(const s of ayik) sekiller.push(s);

  if(!sekiller.length) return null;

  const tek = (o, alan) => {
    if(!o || typeof o !== "object") return null;
    const d = yazi(o[alan]);
    if(!d) return null;
    return {deger:d.slice(0,2), guven:guv(o.guven), foto:foto(o.foto), kutu:kutu(o.kutu),
            yorum:yazi(o.yorum), ogret:yazi(o.ogret)};
  };

  /* hayat başlıkları: falın insanların asıl beklediği kısmı */
  const ALAN = ["is","ask","kisi","yol","saglik","genel"];
  const alanlar = (Array.isArray(j.alanlar) ? j.alanlar : [])
    .map(a => a && typeof a === "object" ? {
      alan: ALAN.indexOf(a.alan) >= 0 ? a.alan : "genel",
      baslik: yazi(a.baslik),
      metin: yazi(a.metin),
      dayanak: yazi(a.dayanak),
      foto: a.foto == null ? null : foto(a.foto),
      kutu: kutu(a.kutu)
    } : null)
    .filter(a => a && a.baslik && a.metin)
    .slice(0, 6);

  let zaman = null;
  if(j.zaman && typeof j.zaman === "object"){
    const s = Math.round(Number(j.zaman.sayi));
    const b = String(j.zaman.birim || "").toLowerCase();
    const birim = /g[uü]n|day/.test(b) ? "gun" : /ay|month/.test(b) ? "ay" : "hafta";
    if(isFinite(s) && s >= 1 && s <= 12)
      zaman = {sayi:s, birim, metin:yazi(j.zaman.metin)};
  }

  return {
    yogunluk: ["acik","denge","yogun"].indexOf(j.yogunluk) >= 0 ? j.yogunluk : "denge",
    baslik: yazi(j.baslik),
    giris: yazi(j.giris),
    sekiller, alanlar, zaman,
    harf: tek(j.harf, "harf"),
    sayi: tek(j.sayi, "sayi"),
    uyari: yazi(j.uyari),
    iltifat: yazi(j.iltifat),
    kapanis: yazi(j.kapanis),
    ozet: (Array.isArray(j.ozet) ? j.ozet : []).map(yazi).filter(Boolean).slice(0,8)
  };
}

/* ══════ yapay zekânın verdiği kutuyu gerçek lekeye oturt ══════
   Amaç: "nerede gördüğünü göster". Kutunun içine düşen gerçek telve
   lekesi varsa onun kendi sınırını çiziyoruz, kaba dikdörtgeni değil. */
/* Yapay zekâ olmayan bir yeri gösterebilir. Uygulama bunu kendi
   ölçümüyle doğruluyor: kutunun içinde gerçekten telve var mı?
   Yoksa o şekil hiç sayfaya çıkmaz.                              */
function kutudaTelveVar(shot, kb){
  if(!kb || !shot._kes || !shot.koyuMask) return false;
  const k = shot._kes, w = shot.work.w, h = shot.work.h;
  const wx0 = (k.x0 + kb[0]*k.w)/k.kay, wx1 = (k.x0 + kb[2]*k.w)/k.kay;
  const wy0 = (k.y0 + kb[1]*k.h)/k.kay, wy1 = (k.y0 + kb[3]*k.h)/k.kay;
  const x0 = Math.max(0, Math.floor(Math.min(wx0,wx1)));
  const x1 = Math.min(w-1, Math.ceil(Math.max(wx0,wx1)));
  const y0 = Math.max(0, Math.floor(Math.min(wy0,wy1)));
  const y1 = Math.min(h-1, Math.ceil(Math.max(wy0,wy1)));
  if(x1 <= x0 || y1 <= y0) return false;
  let toplam = 0, koyu = 0, ortaSay = 0;
  const orta = shot.ortaMask;
  for(let y=y0; y<=y1; y++) for(let x=x0; x<=x1; x++){
    const i = y*w + x;
    toplam++;
    if(shot.koyuMask[i]) koyu++;
    else if(orta && orta[i]) ortaSay++;
  }
  if(!toplam) return false;
  /* Kutunun en az üçte biri gerçek KOYU telve olmalı. Orta tonlu
     silik izler tek başına yetmez; boş porselen hiç yetmez.       */
  const koyuOran = koyu/toplam;
  const hepsi = (koyu + ortaSay)/toplam;
  return koyuOran >= 0.30 || (koyuOran >= 0.18 && hepsi >= 0.55);
}

function kutuyuLekeyeBagla(shot, kb){
  if(!kb) return null;
  const cv = shot._kes;
  if(!cv) return null;
  const wx0 = (cv.x0 + kb[0]*cv.w)/cv.kay, wx1 = (cv.x0 + kb[2]*cv.w)/cv.kay;
  const wy0 = (cv.y0 + kb[1]*cv.h)/cv.kay, wy1 = (cv.y0 + kb[3]*cv.h)/cv.kay;
  const mx = (wx0+wx1)/2, my = (wy0+wy1)/2;

  let en = null, enSkor = -1;
  for(const b of shot.blobs){
    if(b.ak) continue;
    const ic = b.cx >= wx0 && b.cx <= wx1 && b.cy >= wy0 && b.cy <= wy1;
    const d = Math.hypot(b.cx-mx, b.cy-my);
    const kos = Math.max(8, Math.hypot(wx1-wx0, wy1-wy0)*0.60);
    if(!ic && d > kos) continue;
    const skor = (ic ? 1000 : 0) + b.area - d*2.2;
    if(skor > enSkor){ enSkor = skor; en = b; }
  }
  if(en) return en;

  /* Gerçek leke bulunamadı: yapay zekânın verdiği kutuyu aynen
     çiziyoruz. Bu uydurma değil, onun "şurada gördüm" dediği yer.
     İşaretsiz sayfa bırakmıyoruz.                                 */
  return {kutuMod:true, shot:shot,
          x0:Math.min(wx0,wx1), y0:Math.min(wy0,wy1),
          bw:Math.max(8, Math.abs(wx1-wx0)), bh:Math.max(8, Math.abs(wy1-wy0))};
}

/* ══════════════════ FİNCAN MÜZİĞİ — OYNAK ÇİFTETELLİ ══════════════════
   Hazır kayıt kullanmıyoruz: telifli eser App Store'da sorun çıkarır.
   Parça burada, anonim oyun havası geleneğinin usulüyle besteleniyor.

   Usul: ÇİFTETELLİ. 4/4, sekiz sekizlik:
        1 DÜM   2 ka   3 TEK   4 ka   5 DÜM   6 DÜM   7 TEK   8 ka
   Düğün çiftetellisinin o tanıdık, ayağa kaldıran yürüyüşü budur.

   Uzunluk: on dört ayrı ezgi, altı ayrı makam, otuz dört bölümlük bir
   diziliş. Bir tur dört buçuk dakikanın üstünde sürer ve tur dönünce
   süslemeler değiştiği için aynı bölüm bile ikinci kez aynı duyulmaz.

   Takım: klarnet (ezgi), kanun (çırpma ve tremolo), ud basları,
   darbuka ve def zilleri.                                           */

let sesBaglam = null, sesAna = null, sesAcik = false;
let sesSira = 0, sesOlcu = 0;
let sesSonPerde = 0;                    // klarnetin kaydırması için

/* ── makamlar ── */
const SES_MAKAM = {
  hicaz:    [0, 1, 4, 5, 7, 8, 11],
  nihavend: [0, 2, 3, 5, 7, 8, 10],
  rast:     [0, 2, 4, 5, 7, 9, 10],
  kurdi:    [0, 1, 3, 5, 7, 8, 10],
  nikriz:   [0, 2, 3, 6, 7, 9, 10],
  huzzam:   [0, 1, 3, 4, 7, 8, 10]
};
const SES_KOK = 293.66;                 // re
const SES_SEKIZLIK = 0.255;             // ölçü 2,04 sn ≈ 118 vuruş
const SES_ADIM = 8;                     // çiftetelli: sekiz sekizlik

function sesPerde(derece, makam, goc){
  const d = SES_MAKAM[makam] || SES_MAKAM.hicaz;
  const i = ((derece % 7) + 7) % 7;
  const o = Math.floor(derece / 7);
  return SES_KOK * Math.pow(2, (d[i] + 12*o + (goc || 0))/12);
}

/* ── EZGİLER ──
   Her ezgi dört ölçü, her ölçü [derece, kaçıncı sekizlik, kaç sekizlik].
   Boş kalan sekizlikler suskundur; çiftetellinin oynaklığı o
   susmalardan gelir, notayı üst üste yığmaktan değil.              */
const SES_EZGI = [
  /* 0 — giriş çağrısı */
  [ [[4,0,1],[4,1,1],[3,2,1],[4,3,1],[5,4,2],[4,6,2]],
    [[3,0,1],[4,1,1],[3,2,1],[2,3,1],[1,4,2],[0,6,2]],
    [[4,0,1],[5,1,1],[6,2,1],[7,3,1],[6,4,2],[5,6,2]],
    [[4,0,2],[3,2,1],[2,3,1],[1,4,1],[0,5,3]] ],
  /* 1 — tiz cevap */
  [ [[7,0,2],[6,2,1],[7,3,1],[8,4,2],[7,6,2]],
    [[6,0,1],[7,1,1],[6,2,1],[5,3,1],[4,4,2],[5,6,2]],
    [[7,0,1],[6,1,1],[5,2,1],[4,3,1],[3,4,2],[4,6,2]],
    [[5,0,1],[4,1,1],[3,2,1],[2,3,1],[1,4,2],[0,6,2]] ],
  /* 2 — çırpma: baştan sona kısa notalar */
  [ [[0,0,1],[1,1,1],[0,2,1],[4,3,1],[1,4,1],[0,5,1],[1,6,1],[0,7,1]],
    [[4,0,1],[5,1,1],[4,2,1],[3,3,1],[4,4,1],[5,5,1],[4,6,1],[3,7,1]],
    [[7,0,1],[6,1,1],[5,2,1],[4,3,1],[5,4,1],[4,5,1],[3,6,1],[2,7,1]],
    [[1,0,1],[0,1,1],[1,2,1],[4,3,1],[1,4,1],[0,5,3]] ],
  /* 3 — NAKARAT: parçanın akılda kalan yüzü */
  [ [[4,0,2],[5,2,1],[4,3,1],[3,4,2],[4,6,2]],
    [[5,0,2],[7,2,2],[6,4,1],[5,5,1],[4,6,2]],
    [[3,0,2],[4,2,1],[3,3,1],[2,4,2],[1,6,2]],
    [[0,0,3],[1,3,1],[0,4,4]] ],
  /* 4 — pes gezinti */
  [ [[0,0,2],[-1,2,1],[0,3,1],[1,4,2],[2,6,2]],
    [[1,0,1],[2,1,1],[3,2,1],[2,3,1],[1,4,2],[0,6,2]],
    [[-2,0,2],[0,2,2],[1,4,1],[2,5,1],[3,6,2]],
    [[2,0,1],[1,1,1],[0,2,2],[-1,4,1],[0,5,3]] ],
  /* 5 — kıvrak sekme: araları boş, ayak vurulur */
  [ [[4,0,1],[3,2,1],[4,3,1],[5,4,1],[4,6,2]],
    [[2,0,1],[1,2,1],[2,3,1],[3,4,1],[2,6,2]],
    [[5,0,1],[4,2,1],[5,3,1],[6,4,1],[5,6,2]],
    [[3,0,1],[2,2,1],[1,3,1],[0,4,4]] ],
  /* 6 — soru cevap */
  [ [[1,0,1],[1,1,1],[1,2,2],[0,4,1],[1,5,1],[2,6,2]],
    [[4,0,1],[4,1,1],[4,2,2],[3,4,1],[4,5,1],[5,6,2]],
    [[7,0,1],[7,1,1],[7,2,2],[6,4,1],[5,5,1],[4,6,2]],
    [[3,0,1],[2,1,1],[1,2,1],[0,3,1],[1,4,1],[0,5,3]] ],
  /* 7 — uzun ezgi: nefes aldıran bölüm */
  [ [[4,0,4],[5,4,2],[4,6,2]],
    [[3,0,4],[2,4,2],[1,6,2]],
    [[2,0,2],[3,2,2],[4,4,4]],
    [[1,0,2],[0,2,2],[0,4,4]] ],
  /* 8 — tırmanış */
  [ [[0,0,1],[1,1,1],[2,2,1],[3,3,1],[4,4,2],[4,6,2]],
    [[4,0,1],[5,1,1],[6,2,1],[7,3,1],[8,4,2],[8,6,2]],
    [[8,0,1],[7,1,1],[6,2,1],[5,3,1],[4,4,2],[3,6,2]],
    [[2,0,1],[1,1,1],[0,2,2],[0,4,4]] ],
  /* 9 — oturaklı */
  [ [[5,0,2],[4,2,2],[5,4,2],[7,6,2]],
    [[6,0,2],[5,2,2],[4,4,4]],
    [[3,0,2],[4,2,2],[3,4,2],[1,6,2]],
    [[2,0,2],[1,2,2],[0,4,4]] ],
  /* 10 — kıvrım */
  [ [[4,0,1],[5,1,1],[4,2,1],[5,3,1],[4,4,1],[3,5,1],[4,6,2]],
    [[1,0,1],[2,1,1],[1,2,1],[2,3,1],[1,4,1],[0,5,1],[1,6,2]],
    [[5,0,1],[6,1,1],[5,2,1],[6,3,1],[5,4,1],[4,5,1],[5,6,2]],
    [[4,0,1],[3,1,1],[2,2,1],[1,3,1],[0,4,4]] ],
  /* 11 — coşku: en tiz yer */
  [ [[8,0,1],[7,1,1],[8,2,1],[9,3,1],[8,4,2],[7,6,2]],
    [[7,0,1],[6,1,1],[7,2,1],[8,3,1],[7,4,2],[6,6,2]],
    [[5,0,1],[6,1,1],[7,2,1],[6,3,1],[5,4,2],[4,6,2]],
    [[4,0,1],[3,1,1],[2,2,1],[1,3,1],[0,4,4]] ],
  /* 12 — hafif ve seyrek */
  [ [[0,0,2],[0,3,1],[1,4,1],[0,6,2]],
    [[4,0,2],[4,3,1],[3,4,1],[4,6,2]],
    [[5,0,2],[5,3,1],[4,4,1],[3,6,2]],
    [[2,0,2],[1,3,1],[0,4,4]] ],
  /* 13 — kapanış */
  [ [[7,0,2],[6,2,1],[5,3,1],[4,4,2],[5,6,2]],
    [[4,0,2],[3,2,1],[2,3,1],[1,4,2],[2,6,2]],

    [[1,0,2],[0,2,2],[0,4,4]] ]

/* ── DİZİLİŞ ──
   [ezgi, makam, göçürme]. Nakarat (3) her makamda bir kez dönüyor;
   arada makam değişince aynı nakarat bile yeni bir parça gibi
   duyuluyor. Otuz dört bölüm, yüz otuz altı ölçü: 4 dk 37 sn.    */
const SES_DIZI = [
  [0,"hicaz",0],   [1,"hicaz",0],   [3,"hicaz",0],   [2,"hicaz",0],
  [5,"hicaz",0],   [3,"hicaz",0],
  [4,"nihavend",0],[6,"nihavend",0],[7,"nihavend",0],[10,"nihavend",0],
  [3,"nihavend",0],
  [8,"rast",-2],   [9,"rast",-2],   [12,"rast",-2],  [6,"rast",-2],
  [3,"rast",-2],
  [11,"kurdi",3],  [2,"kurdi",3],   [5,"kurdi",3],   [13,"kurdi",3],
  [3,"kurdi",3],
  [0,"nikriz",-4], [7,"nikriz",-4], [10,"nikriz",-4],[1,"nikriz",-4],
  [3,"nikriz",-4],
  [12,"huzzam",1], [8,"huzzam",1],  [4,"huzzam",1],  [11,"huzzam",1],
  [9,"huzzam",1],  [13,"huzzam",1],
  [3,"hicaz",0],   [13,"hicaz",0]
];

function sesKur(){
  if(sesBaglam) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return false;
  try{
    sesBaglam = new AC();
    sesAna = sesBaglam.createGain();
    sesAna.gain.value = 0.0001;

    const suz = sesBaglam.createBiquadFilter();
    suz.type = "lowpass";
    suz.frequency.value = 5200;          // çiftetelli parlak olmalı

    /* kısa gecikme: düğün salonunun yankısı */
    const gec = sesBaglam.createDelay(0.6);
    gec.delayTime.value = 0.191;
    const geri = sesBaglam.createGain(); geri.gain.value = 0.16;
    const gecSes = sesBaglam.createGain(); gecSes.gain.value = 0.17;

    sesAna.connect(suz);
    suz.connect(sesBaglam.destination);
    suz.connect(gec);
    gec.connect(geri); geri.connect(gec);
    gec.connect(gecSes); gecSes.connect(sesBaglam.destination);
    return true;
  }catch(e){ sesBaglam = null; return false; }
}

let sesGurultu = null;
function sesGurultuTamponu(){
  if(sesGurultu) return sesGurultu;
  const n = Math.floor(sesBaglam.sampleRate * 1.5);
  const t = sesBaglam.createBuffer(1, n, sesBaglam.sampleRate);
  const d = t.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  return (sesGurultu = t);
}
function sesGurultuCal(t, sure, tip, frekans, q, seviye){
  const k = sesBaglam.createBufferSource();
  k.buffer = sesGurultuTamponu();
  k.loop = true;
  const f = sesBaglam.createBiquadFilter();
  f.type = tip; f.frequency.value = frekans; f.Q.value = q;
  const g = sesBaglam.createGain();
  g.gain.setValueAtTime(seviye, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
  k.connect(f); f.connect(g); g.connect(sesAna);
  k.start(t); k.stop(t + sure + 0.02);
}

/* ── KLARNET ──
   Çiftetellinin asıl sesi. Kamıştan gelen o dolgun, hafif burunlu
   tını: testere ile kare dalganın karışımı, tiz ucu kısılmış, üstüne
   vibrato. Notadan notaya kaydırma (glissando) bu müziği Türk
   yapan şeydir; ondan vazgeçmiyoruz.                              */
function sesKlarnet(frekans, baslangic, sure, seviye, kaydirdan){
  if(!sesBaglam) return;
  const t = baslangic, s = Math.max(0.10, sure);

  const o1 = sesBaglam.createOscillator(); o1.type = "sawtooth";
  const o2 = sesBaglam.createOscillator(); o2.type = "square";
  const kar = sesBaglam.createGain();  kar.gain.value = 0.55;
  const kar2 = sesBaglam.createGain(); kar2.gain.value = 0.45;

  const kay = (kaydirdan && kaydirdan > 20 &&
               Math.abs(Math.log2(kaydirdan/frekans)) < 0.42) ? kaydirdan : 0;
  for(const o of [o1, o2]){
    if(kay){
      o.frequency.setValueAtTime(kay, t);
      o.frequency.exponentialRampToValueAtTime(frekans, t + Math.min(0.075, s*0.35));
    } else o.frequency.setValueAtTime(frekans, t);
  }
  o2.detune.value = -4;

  /* rezonanslı süzgeç: kamışın nefesle açılıp kapanması */
  const f = sesBaglam.createBiquadFilter();
  f.type = "lowpass"; f.Q.value = 7;
  f.frequency.setValueAtTime(Math.min(7000, frekans*2.0), t);
  f.frequency.linearRampToValueAtTime(Math.min(9000, frekans*4.6), t + 0.05);
  f.frequency.exponentialRampToValueAtTime(Math.max(360, frekans*2.1), t + s);

  /* vibrato: girişte yok, nota uzadıkça açılır */
  const lfo = sesBaglam.createOscillator();
  lfo.frequency.setValueAtTime(5.2, t);
  lfo.frequency.linearRampToValueAtTime(6.4, t + s);
  const lfoG = sesBaglam.createGain();
  lfoG.gain.setValueAtTime(0, t);
  lfoG.gain.linearRampToValueAtTime(frekans*0.016, t + Math.min(0.30, s));
  lfo.connect(lfoG); lfoG.connect(o1.frequency); lfoG.connect(o2.frequency);

  const g = sesBaglam.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(seviye, t + 0.022);
  g.gain.exponentialRampToValueAtTime(seviye*0.78, t + s*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + s + 0.05);

  o1.connect(kar); o2.connect(kar2);
  kar.connect(f); kar2.connect(f);
  f.connect(g); g.connect(sesAna);
  o1.start(t); o2.start(t); lfo.start(t);
  o1.stop(t + s + 0.08); o2.stop(t + s + 0.08); lfo.stop(t + s + 0.08);
  /* nefes: kamışın hışırtısı */
  sesGurultuCal(t, Math.min(0.09, s), "bandpass", frekans*2.4, 1.4, seviye*0.10);
}

/* ── KANUN ── tel çırpması: sert giriş, hızlı sönüm */
function sesKanun(frekans, baslangic, seviye){
  if(!sesBaglam) return;
  const t = baslangic;
  const kat = [[1, 1.00, 0.95], [2, 0.42, 0.52], [3, 0.20, 0.34],
               [4.18, 0.10, 0.22], [5.4, 0.05, 0.15]];
  for(const [carp, guc, sonum] of kat){
    const o = sesBaglam.createOscillator();
    o.type = "triangle";
    o.frequency.value = frekans * carp;
    o.detune.value = (carp === 1) ? 0 : 5;
    const g = sesBaglam.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(seviye*guc, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sonum);
    o.connect(g); g.connect(sesAna);
    o.start(t); o.stop(t + sonum + 0.02);
  }
  sesGurultuCal(t, 0.020, "highpass", 2600, 0.7, seviye*0.28);
}

/* ── UD BASI ── ölçüyü ayakta tutan pes tel */
function sesBas(frekans, baslangic, sure, seviye){
  if(!sesBaglam) return;
  const t = baslangic, s = Math.max(0.14, sure);
  const o = sesBaglam.createOscillator(); o.type = "triangle";
  o.frequency.value = frekans;
  const alt = sesBaglam.createOscillator(); alt.type = "sine";
  alt.frequency.value = frekans/2;
  const f = sesBaglam.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = frekans*3.4; f.Q.value = 2;
  const g = sesBaglam.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(seviye, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + s);
  o.connect(f); alt.connect(f); f.connect(g); g.connect(sesAna);
  o.start(t); alt.start(t); o.stop(t + s + 0.03); alt.stop(t + s + 0.03);
}

/* ── DARBUKA ──
   DÜM: göbeğe vurulur, pes ve yankılı. TEK: kenara, keskin ve tiz.
   KA: sol elin hafif dokunuşu.                                   */
function sesDum(baslangic, seviye){
  if(!sesBaglam) return;
  const t = baslangic;
  const o = sesBaglam.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(178, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.10);
  const g = sesBaglam.createGain();
  g.gain.setValueAtTime(seviye, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
  o.connect(g); g.connect(sesAna);
  o.start(t); o.stop(t + 0.32);
  sesGurultuCal(t, 0.035, "lowpass", 900, 0.9, seviye*0.55);
}
function sesTek(baslangic, seviye){
  if(!sesBaglam) return;
  const t = baslangic;
  sesGurultuCal(t, 0.070, "bandpass", 1950, 1.6, seviye);
  const o = sesBaglam.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(620, t);
  o.frequency.exponentialRampToValueAtTime(300, t + 0.035);
  const g = sesBaglam.createGain();
  g.gain.setValueAtTime(seviye*0.55, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g); g.connect(sesAna);
  o.start(t); o.stop(t + 0.08);
}
function sesKa(baslangic, seviye){
  sesGurultuCal(baslangic, 0.040, "bandpass", 3100, 2.2, seviye);
}
/* ── DEF ZİLLERİ ── oynaklığı taşıyan asıl şey */
function sesZil(baslangic, seviye){
  if(!sesBaglam) return;
  sesGurultuCal(baslangic, 0.11, "highpass", 6200, 0.8, seviye);
  sesGurultuCal(baslangic + 0.012, 0.07, "bandpass", 9400, 1.2, seviye*0.7);
}
/* parmak yuvarlaması: ölçü sonlarını süsler */
function sesYuvarla(baslangic, adet, aralik, seviye){
  for(let i=0;i<adet;i++) sesKa(baslangic + i*aralik, seviye*(0.5 + i/adet*0.5));
}

/* ── BİR ÖLÇÜ ── */
function sesOlcuKur(baslangic, no){
  const dizi = SES_DIZI[Math.floor(no/4) % SES_DIZI.length];
  const [ezgiNo, makam, goc] = dizi;
  const olcuNo = no % 4;
  const olcu = SES_EZGI[ezgiNo][olcuNo];
  const bolumNo = Math.floor(no/4) % SES_DIZI.length;
  const tur = Math.floor(no / (SES_DIZI.length*4));
  const S = SES_SEKIZLIK;
  /* doku: her bölüm başka bir takımla çalınsın */
  const doku = (bolumNo + tur) % 3;

  /* ── ezgi ── */
  for(const [derece, bas, sure] of olcu){
    const t = baslangic + bas*S;
    const f = sesPerde(derece, makam, goc);
    const uz = sure*S*0.94;

    if(doku !== 1){
      sesKlarnet(f, t, uz, 0.105, sesSonPerde);
      sesSonPerde = f;
    }
    if(doku !== 2 || sure >= 2){
      /* kanun ezgiyi bir oktav pesten çırparak destekler */
      sesKanun(sesPerde(derece - 7, makam, goc), t, doku === 1 ? 0.090 : 0.050);
    }
    /* uzun notayı boş bırakma: kanun tremolosu */
    if(sure >= 3)
      for(let q=1; q<sure*2; q++)
        sesKanun(f, t + q*0.5*S, 0.026);
    /* kısa notalarda süsleme: her turda başka aralık */
    else if(sure === 1 && ((bas + bolumNo) % 4) === 0){
      const sus = [1, 2, -1, 1, 2, -2][(tur + bolumNo) % 6];
      sesKanun(sesPerde(derece + sus, makam, goc), t + S*0.5, 0.022);
    }
  }

  /* ── ud basları: DÜM'lerin altına ── */
  const kokDerece = [0, 0, 4, 0][olcuNo];
  sesBas(sesPerde(kokDerece - 14, makam, goc), baslangic, S*2.4, 0.115);
  sesBas(sesPerde(kokDerece - 14, makam, goc), baslangic + 4*S, S*1.6, 0.090);
  sesBas(sesPerde(kokDerece - 10, makam, goc), baslangic + 5*S, S*1.4, 0.070);

  /* ── ÇİFTETELLİ USULÜ ──
     1 DÜM · 2 ka · 3 TEK · 4 ka · 5 DÜM · 6 DÜM · 7 TEK · 8 ka   */
  sesDum(baslangic + 0*S, 0.30);
  sesKa (baslangic + 1*S, 0.055);
  sesTek(baslangic + 2*S, 0.135);
  sesKa (baslangic + 3*S, 0.055);
  sesDum(baslangic + 4*S, 0.27);
  sesDum(baslangic + 5*S, 0.21);
  sesTek(baslangic + 6*S, 0.135);
  sesKa (baslangic + 7*S, 0.055);

  /* def zilleri: her sekizliğin ortasında; bazı bölümlerde susar
     ki geri geldiğinde parça yeniden canlansın                   */
  if((bolumNo % 7) !== 5){
    for(let i=0;i<8;i++) sesZil(baslangic + (i + 0.5)*S, i % 2 ? 0.030 : 0.042);
  }
  /* dört ölçüde bir yuvarlama: bölüm değişiminin habercisi */
  if(olcuNo === 3) sesYuvarla(baslangic + 6.5*S, 4, S*0.25, 0.075);

  return SES_ADIM * S;
}

function sesBesle(){
  if(!sesAcik || !sesBaglam) return;
  const simdi = sesBaglam.currentTime;
  if(sesSira < simdi + 0.25) sesSira = simdi + 0.25;
  let guard = 0;
  while(sesSira < simdi + 3 && guard++ < 16){
    sesSira += sesOlcuKur(sesSira, sesOlcu);
    sesOlcu++;
  }
}

function sesBaslat(){
  if(sesAcik) return;
  if(!sesKur()) return;
  if(sesBaglam.state === "suspended") sesBaglam.resume();
  sesAcik = true;
  sesSonPerde = 0;
  const t = sesBaglam.currentTime;
  sesSira = t + 0.3;
  sesAna.gain.cancelScheduledValues(t);
  sesAna.gain.setValueAtTime(0.0001, t);
  sesAna.gain.exponentialRampToValueAtTime(0.40, t + 1.6);
  sesBesle();
  clearInterval(sesBaslat._saat);
  sesBaslat._saat = setInterval(sesBesle, 1200);
  try{ localStorage.setItem("fincan-ses", "1"); }catch(e){}
  sesDugmeYaz();
}

function sesDurdur(){
  sesAcik = false;
  clearInterval(sesBaslat._saat);
  if(sesBaglam && sesAna){
    const t = sesBaglam.currentTime;
    sesAna.gain.cancelScheduledValues(t);
    sesAna.gain.setValueAtTime(sesAna.gain.value, t);
    sesAna.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  }
  try{ localStorage.setItem("fincan-ses", "0"); }catch(e){}
  sesDugmeYaz();
}

function sesCevir(){ sesAcik ? sesDurdur() : sesBaslat(); }

function sesIster(){
  try{ return localStorage.getItem("fincan-ses") !== "0"; }catch(e){ return true; }
}

function sesDugmeYaz(){
  for(const kimlik of ["b-ses", "b-ses-ust"]) sesDugmeBir(kimlik);
}
function sesDugmeBir(kimlik){
  const d = document.getElementById(kimlik);
  if(!d) return;
  d.setAttribute("aria-pressed", String(sesAcik));
  d.textContent = sesAcik ? "♫" : "♪";
  d.style.opacity = sesAcik ? "1" : ".55";
  const T = (typeof P === "function") ? P().ui : null;
  if(T) d.title = sesAcik ? (T.sesKapat || "") : (T.sesAc || "");
}

/* ══════════════════ FOTOĞRAF KALİTESİ ══════════════════ */

function quality(shot){
  const g = shot.gray, w = shot.work.w, h = shot.work.h, c = shot.cup;
  let n = 0, sum = 0, koyu = 0, parlak = 0, kx = 0, ky = 0, px = 0, py = 0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(cupR(c, x, y) > 0.95) continue;
    const v = g[y*w+x];
    sum += v; n++;
    if(v < 34){ koyu++; kx += x-c.cx; ky += y-c.cy; }
    else if(v > 250){ parlak++; px += x-c.cx; py += y-c.cy; }
  }
  const mean = sum/Math.max(1,n);

  let ls = 0, lss = 0, lc = 0;
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    if(cupR(c, x, y) > 0.95) continue;
    const i = y*w+x;
    const L = 4*g[i] - g[i-1] - g[i+1] - g[i-w] - g[i+w];
    ls += L; lss += L*L; lc++;
  }
  const lm = ls/Math.max(1,lc);
  const lvar = lss/Math.max(1,lc) - lm*lm;

  const yon = (dx,dy) => Math.abs(dx) > Math.abs(dy) ? (dx<0?"sol":"sag") : (dy<0?"ust":"alt");
  shot.metrics = {mean:Math.round(mean), sharp:Math.round(lvar), frac:shot.frac, shapes:shot.blobs.length};

  if(mean < 72)                   return {level:"kotu", code:"dark"};
  if(mean > 233)                  return {level:"kotu", code:"bright"};
  if(lvar < 55)                   return {level:"kotu", code:"blur"};
  if(koyu/Math.max(1,n) > 0.11)   return {level:"kotu", code:"shadow", yon:yon(kx/koyu, ky/koyu)};
  if(parlak/Math.max(1,n) > 0.09) return {level:"kotu", code:"glare",  yon:yon(px/parlak, py/parlak)};
  if(shot.frac < 0.04)            return {level:"kotu", code:"nogrounds"};
  if(shot.blobs.length < 2)       return {level:"kotu", code:"fewshapes"};
  if(lvar < 130 || mean < 86 || mean > 218) return {level:"orta", code:"soft"};
  return {level:"ok", code:null};
}

/* ══════════════════ FOTOĞRAFI ÇÖZÜMLE ══════════════════ */

let shots = [];
let baseSeed = 1;
let pages = [];
let curPage = 0;

/* Kullanıcının çizdiği elipsin içine bakar. Kulp, tabak, masa hep dışarıda. */
function analyzeShot(img, url, elips){
  const prevW = work, prevC = cup;
  const wk = toWork(img);
  work = wk;
  const g = grayOf(wk.data);
  const c = elips ? Object.assign({}, elips) : findCup(g, wk.w, wk.h);
  c.area = Math.PI*c.rx*c.ry;
  c.r = (c.rx + c.ry)/2;
  cup = c;

  const seg = segment(g, wk.w, wk.h, c);
  /* Çok küçük izler fotoğrafta zaten net görünmez; okunursa
     kullanıcı fincanına bakıp bulamaz. Alt sınırı yükselttik. */
  const minA = Math.max(90, Math.round(c.area*0.0045));

  let koyular = components(seg.mask, wk.w, wk.h, minA)
                  .map(pts => buildBlob(pts, wk.w, 0))
                  .filter(b => b.area < c.area*0.72);
  koyular.forEach(b => { b.ton = "koyu"; });

  /* orta tonlu izler: duvara yapışmış soluk çizgiler, kenar bulaşmaları.
     Fal okurken en çok konuşulan izler bunlar.                        */
  const ortaMask = segmentOrta(g, wk.w, wk.h, c, seg.mask);
  const ortalar = components(ortaMask, wk.w, wk.h, Math.max(70, Math.round(c.area*0.0035)))
                    .map(pts => buildBlob(pts, wk.w, 0))
                    .filter(b => b.area < c.area*0.34);
  ortalar.forEach(b => { b.ton = "orta"; });
  koyular = koyular.concat(ortalar);

  /* telvenin bıraktığı beyaz alanlar: kenar halkası dışarıda kalsın */
  /* Beyaz kuralı: büyük boş alanlar okunmaz. Yalnızca telvenin
     ARASINDA kalan, etrafı koyuyla çevrili küçük boşluklar okunur.  */
  const ak = new Uint8Array(g.length);
  for(let y=0;y<wk.h;y++) for(let x=0;x<wk.w;x++){
    const i = y*wk.w+x;
    if(cupR(c, x, y) <= 0.86 && !seg.mask[i]) ak[i] = 1;
  }
  let aklar = components(erode(ak, wk.w, wk.h, 2), wk.w, wk.h, Math.max(70, minA))
                .map(pts => buildBlob(pts, wk.w, 0))
                .filter(b => b.area > c.area*0.006 && b.area < c.area*0.045)
                .filter(b => cevrili(b, seg.mask, wk.w, wk.h));

  const shot = {work:wk, gray:g, cup:c, frac:seg.frac, url:url, img:img,
                koyuMask:seg.mask, ortaMask:ortaMask,
                seed:seedFrom(wk.data.data), blobs:[]};

  /* büyük kütleleri boğumlarından ayır: bütününe bakınca hiçbir şeye benzemiyor */
  const parcala = (liste, akMi) => {
    const cikti = [];
    for(const b of liste){
      b.shot = shot; b.ak = akMi;
      const p = (b.area > c.area*0.035) ? splitBlob(b, wk.w, 4) : [b];
      for(const q of p){ q.shot = shot; q.ak = akMi; cikti.push(q); }
    }
    /* Fincanın dışına taşan hiçbir leke okunmaz. Kahve falı fincandan
       ibarettir: kulp, tabak, masa ve elin gölgesi burada elenir.     */
    return cikti.map(b => kirpBlob(b, c, 0.90, wk.w))
                .filter(b => b && b.area >= minA);
  };

  /* İki tonu ayrı ayrı seçiyoruz. Tek listede sıralarsak dipteki
     kocaman kütle bütün yerleri kapar ve duvardaki ince izler hiç
     okunmaz; oysa fal okurken asıl konuşulan onlardır.            */
  const hepsi = parcala(koyular, false);
  const kSirali = hepsi.filter(b => b.ton !== "orta").sort((a,b)=>b.area-a.area).slice(0, 14);
  const oSirali = hepsi.filter(b => b.ton === "orta").sort((a,b)=>b.area-a.area).slice(0, 8);
  koyular = kSirali.concat(oSirali);
  aklar   = parcala(aklar, true).sort((a,b)=>b.area-a.area).slice(0, 6);

  /* Her leke ne kadar koyu? Silik izi belirgin izden ayırmanın tek
     dürüst yolu bu: ortalama griyi ölçüp 0-1 arasına indiriyoruz.  */
  for(const b of koyular.concat(aklar)){
    let t = 0, s = 0;
    for(let y=0;y<b.bh;y++) for(let x=0;x<b.bw;x++){
      if(!b.mask[y*b.bw+x]) continue;
      const i = (b.y0+y)*wk.w + (b.x0+x);
      if(i >= 0 && i < g.length){ t += g[i]; s++; }
    }
    b.karanlik = s ? (255 - t/s)/255 : 0;
  }

  shot.blobs = koyular.concat(aklar);

  /* Lekenin bütününe bakıp isim aramak yanlış. Falcı kütlenin kenarına
     bakar ve aynı lekede birden fazla figür görür: bir çıkıntı hortum,
     bir girinti yüz profili olur. En büyük iki kütlede pencere
     gezdirip içlerindeki siluetleri ayrı ayrı arıyoruz.            */
  shot.parcalar = [];
  const enBuyukler = koyular.filter(b => !b.ak && b.area > c.area*0.02)
                            .sort((a,b)=>b.area-a.area).slice(0, 2);
  for(const b of enBuyukler){
    for(const p of altSekiller(b, 0.56, 4)){
      p.shot = shot;
      shot.parcalar.push(p);
    }
  }

  shot.q = quality(shot);
  work = prevW; cup = prevC;
  return shot;
}

function vurgu(ad){
  const p = ad.split(" ");
  if(p.length === 1) return "<em>" + ad + "</em>";
  return p.slice(0,-1).join(" ") + " <em>" + p[p.length-1] + "</em>";
}
function cap(s){ return s.charAt(0).toLocaleUpperCase(P().loc) + s.slice(1); }
function shotIx(sh){ return shots.indexOf(sh); }

/* ══════════════════ GEÇMİŞ FALLAR ══════════════════
   Aynı telefonda aynı adla gelen kişinin önceki fallarını hatırlıyoruz.
   Böylece "geçen sefer şunu konuşmuştuk, bugün biraz farklı" diyebiliyoruz.
   Hiçbir yere gönderilmez, yalnızca cihazda durur.                  */
function gecmisAnahtar(){
  return "fincan-gecmis-" + (KULLANICI_ADI || "misafir").toLocaleLowerCase("tr");
}
function gecmisOku(){
  try{
    const h = JSON.parse(localStorage.getItem(gecmisAnahtar()) || "[]");
    return Array.isArray(h) ? h.slice(-6) : [];
  }catch(e){ return []; }
}
function gecmisYaz(semboller, baslik){
  try{
    const h = gecmisOku();
    h.push({t:new Date().toISOString().slice(0,10),
            s:(semboller || []).slice(0,6), b:baslik || ""});
    localStorage.setItem(gecmisAnahtar(), JSON.stringify(h.slice(-6)));
  }catch(e){}
}
/* Önceki fallarda en çok geçen sembol: bağ cümlesi bunun üstüne kurulur */
function gecmisSembol(){
  const h = gecmisOku();
  if(!h.length) return null;
  const say = {};
  for(const k of h) for(const s of (k.s || [])) say[s] = (say[s] || 0) + 1;
  let en = null, enN = 0;
  for(const s in say) if(say[s] > enN){ enN = say[s]; en = s; }
  return en;
}
function gecmisMetni(){
  const h = gecmisOku();
  if(!h.length) return "";
  /* Tarih vermiyoruz: "eylülde şunu demiştik" tuhaf duruyor.
     Sadece hangi şekillerin çıktığını, eskiden yeniye sıralıyoruz. */
  return h.map(k => (k.s || []).join(", ")).filter(Boolean).join(" || ");
}

/* ══════════════════ SAYFALARI KUR ══════════════════ */

function yerAdi(T, bolge, yon){
  const y = T.sideTxt[yon] || T.sideTxt.yan || T.sideTxt.yakin;
  return (T.zoneTxt[bolge] || T.zoneTxt.orta) + " · " + y;
}
const cogul = l => Array.isArray(l) ? l : [l];

/* uyarı ve iltifat: her fala değil, ara sıra ve en fazla birer tane */
/* Parçalardan cümle kur. Hazır cümle havuzundan çekersek iki
   fincanda aynı cümle çıkıyor; böyle kurunca her duygu için
   onlarca ayrı cümle oluyor.                                     */
function parcaliCumle(havuz){
  if(!havuz || !havuz.length) return "";
  const s = pick(havuz);
  return [pick(s.ac), pick(s.orta), pick(s.son)].filter(Boolean).join(" ");
}

/* Fal metninin arasına serpiştirilen kişisel cümleler. Hepsini birden
   koyarsak sayfa ek cümleyle dolar; dengeli bir karışım seçiyoruz. */
function serpistir(sayfalar, T){
  const sym = sayfalar.filter(p => p.kind === "sym");
  if(!sym.length) return;

  const bosSayfa = () => {
    const aday = sym.filter(p => !p.ekli);
    const liste = aday.length ? aday : sym;
    const p = liste[Math.floor(rnd()*liste.length) % liste.length];
    p.ekli = true;
    return p;
  };
  const koy = metin => { if(metin) bosSayfa().body.push(nm(metin)); };

  koy(parcaliCumle(T.duyguParca));                  // her falda bir duygu
  if(T.ruhHali && T.ruhHali.length) koy(pick(T.ruhHali));

  /* gerisi dönüşümlü: aynı fal iki kere aynı karışımı vermesin */
  const yedek = [];
  if(T.saflikParca && T.saflikParca.length) yedek.push(() => parcaliCumle(T.saflikParca));
  if(T.cevreKonusuyor && T.cevreKonusuyor.length) yedek.push(() => pick(T.cevreKonusuyor));
  if(T.iltifatlar && T.iltifatlar.length) yedek.push(() => pick(T.iltifatlar));
  if(T.uyarilar && T.uyarilar.length) yedek.push(() => pick(T.uyarilar));
  for(let i=yedek.length-1; i>0; i--){
    const j = Math.floor(rnd()*(i+1)) % (i+1);
    const t = yedek[i]; yedek[i] = yedek[j]; yedek[j] = t;
  }
  if(yedek[0]) koy(yedek[0]());
  if(yedek[1]) koy(yedek[1]());
}

function kapanisSayfasi(T, hikaye, kapanisMetni, ozet){
  const ekle = T.loc === "tr" ? " ve nihayet " : " and finally ";
  const ara  = T.loc === "tr" ? ", sonra " : ", then ";
  const h5 = hikaye.filter(Boolean).slice(0, 5);
  let zincir = "";
  if(h5.length === 1) zincir = h5[0];
  else if(h5.length > 1) zincir = h5.slice(0,-1).join(ara) + ekle + h5[h5.length-1];
  const body = [nm(T.sonGiris)];
  if(zincir) body.push(T.sonBaglar(zincir));
  body.push(nm(kapanisMetni || T.sonKapanis));
  if(shots.length < 3) body.push(nm(T.eksikFoto[shots.length] || T.eksikFoto[1]));
  /* Yarına davet, sonra dilek. Ara sıra da müjde. */
  body.push(nm(pick(T.yarinGel)));
  const kutlama = rnd() < 0.2 ? " " + T.mujde : "";
  body.push(nm(pick(T.dilek)) + kutlama);
  return {kind:"son", blobs:[], shot:shots[0], kicker:T.sonSayfa, title:T.sonTitle,
          where:T.ozet, body, liste:ozet};
}

/* ══════════════════ YAPAY ZEKÂNIN OKUMASINDAN SAYFA ══════════════════ */
function buildPagesAI(v){
  const T = P();
  seedVal = baseSeed;
  pages = [];
  if(!shots.length || !v || !v.sekiller.length) return false;

  const k = T.kapak[v.yogunluk] || T.kapak.denge;
  const kapakBody = [nm(v.giris || (k.alt ? pick(k.alt) : k.a))];
  kapakBody.push(nm(shots.length >= 3 ? T.tamFoto : (T.eksikFoto[shots.length] || T.eksikFoto[1])));
  const oncekiAi = gecmisSembol();
  if(oncekiAi && T.gecmisBag)
    kapakBody.push(nm(pick(T.gecmisBag).split("{onceki}").join(oncekiAi)));
  pages.push({kind:"kapak", blobs:[], shot:shots[0], kicker:T.ord[1] + T.ordSuffix,
              title: v.baslik ? vurgu(cap(v.baslik)) : k.t, where:T.genel, body:kapakBody});

  const hikaye = [];
  /* Kutusunda telve olmayan şekli hiç göstermiyoruz: boş porselene
     ad vermek falın inandırıcılığını tek başına bitirir.          */
  v.sekiller = v.sekiller.filter(s => {
    const sh = shots[s.foto] || shots[0];
    return s.kutu && kutudaTelveVar(sh, s.kutu);
  });
  if(!v.sekiller.length) return false;

  v.sekiller.forEach((s, i)=>{
    const sh = shots[s.foto] || shots[0];
    const b = kutuyuLekeyeBagla(sh, s.kutu);
    const blobs = b ? [b] : [];
    hikaye.push(String(s.ad).toLocaleLowerCase(T.loc));
    pages.push({
      kind:"sym", blobs, shot:sh,
      kicker: T.ord[Math.min(T.ord.length-1, i+2)] + T.ordSuffix,
      title: vurgu(cap(s.ad)),
      where: cap(yerAdi(T, s.bolge, s.yon)),
      gordugum: s.gordugum ? nm(s.gordugum) : "",
      ogret: s.ogret ? nm(s.ogret) : (T.ogretZon[s.bolge] + " " + T.ogretYan[s.yon]),
      tahmin: s.tahmin ? nm(s.tahmin) : "",
      kanit: (b && !b.kutuMod) ? {grid:gridOf(b).m, ad:T.kanitSekil} : null,
      body: [nm(s.yorum)]
    });
  });

  if(v.uyari)   pages[Math.min(pages.length-1, 1 + Math.floor(v.sekiller.length/2))].body.push(nm(v.uyari));
  if(v.iltifat) pages[Math.min(pages.length-1, 1)].body.push(nm(v.iltifat));

  /* ── hayat başlıkları ──
     Şekilleri tek tek saymak fal değildir. İnsan fincanı kendi
     hayatının başlıkları hâlinde duymak ister: iş, aşk, yol, kişi.  */
  for(const a of v.alanlar){
    const sh = (a.foto != null && shots[a.foto]) ? shots[a.foto] : shots[0];
    /* hayat başlığının kutusu da telve göstermeli */
    const b = (a.kutu && kutudaTelveVar(sh, a.kutu)) ? kutuyuLekeyeBagla(sh, a.kutu) : null;
    pages.push({
      kind:"sym", blobs: b ? [b] : [], shot:sh,
      kicker:T.alanKicker, title:vurgu(cap(a.baslik)),
      where: T.alanAd[a.alan] || "",
      ogret: a.dayanak ? nm(T.dayanakOn + " " + a.dayanak) : "",
      kanit: (b && !b.kutuMod) ? {grid:gridOf(b).m, ad:T.kanitSekil} : null,
      body:[nm(a.metin)]
    });
  }

  /* ── zaman ── */
  if(v.zaman){
    const birimAd = T.zamanBirim[v.zaman.birim] || T.zamanBirim.hafta;
    pages.push({
      kind:"sym", blobs:[], shot:shots[0],
      kicker:T.zamanKicker, title:T.zamanTitle(v.zaman.sayi, birimAd),
      where:T.tamami, ogret:T.sayiOgret,
      body:[nm(v.zaman.metin || T.zamanYedek(v.zaman.sayi, birimAd))]
    });
  }

  /* harf: yapay zekâ emin değilse hiç açılmaz */
  if(v.harf){
    const sh = shots[v.harf.foto] || shots[0];
    const b = kutuyuLekeyeBagla(sh, v.harf.kutu);
    pages.push({
      kind:"sym", blobs: b ? [b] : [], shot:sh, kicker:T.harfKicker,
      title:T.harfTitle(v.harf.deger), where:T.genel,
      ogret: v.harf.ogret ? nm(v.harf.ogret) : "",
      kanit: (b && !b.kutuMod) ? {grid:gridOf(b).m, ad:T.kanitSekil} : null,
      body:[nm(v.harf.yorum), nm(T.harfSon)]
    });
  }
  if(v.sayi){
    const sh = shots[v.sayi.foto] || shots[0];
    const b = kutuyuLekeyeBagla(sh, v.sayi.kutu);
    pages.push({
      kind:"sym", blobs: b ? [b] : [], shot:sh, kicker:T.sayiKicker,
      title:T.sayiTitle(v.sayi.deger), where:T.genel,
      ogret: v.sayi.ogret ? nm(v.sayi.ogret) : "",
      kanit: (b && !b.kutuMod) ? {grid:gridOf(b).m, ad:T.kanitSekil} : null,
      body:[nm(v.sayi.yorum), nm(T.sayiSon(v.sayi.deger))]
    });
  }
  /* harf ya da rakam yoksa sessiz geçiyoruz */

  const ozet = v.ozet && v.ozet.length ? v.ozet
             : pages.filter(p => p.kind === "sym").map(p => p.title.replace(/<[^>]+>/g,""));
  pages.push(kapanisSayfasi(T, hikaye, v.kapanis, ozet));
  return true;
}

/* ══════════════════ CİHAZDAKİ MOTORDAN SAYFA ══════════════════ */
function buildPages(){
  const T = P();
  seedVal = baseSeed;
  pages = [];
  if(!shots.length) return;

  const tagged = [];
  for(const sh of shots) for(const b of sh.blobs){
    const c = b.ak ? classifyAk(b) : classify(b);
    tagged.push({b, sh, ak:!!b.ak, sym:c.sym, guven:c.guven, kanit:c.kanit, neden:c.neden, gorunen:c.gorunen,
                 pos:place(b), rel:b.area/Math.max(1, sh.cup.area)});
  }

  const koyu = tagged.filter(t => !t.ak).sort((a,b)=> (b.guven - a.guven) || (b.rel - a.rel));
  const beyaz = tagged.filter(t => t.ak).sort((a,b)=>b.rel-a.rel);
  const used = new Set();

  /* ── harf ve rakam ──
     Eşik yüksek tutuldu. Geçen yoksa harf/sayı sayfası HİÇ açılmaz;
     uydurma harf çıkarmaktansa açıkça "yok" demek daha dürüst.       */
  const NOTR = new Set(["iz","goz","bulut","kivrimliYol"]);
  const adaylar = koyu.filter(t => NOTR.has(t.sym) && letterish(t.b) >= 5);
  let harfM = null, sayiM = null;
  for(const t of adaylar){
    const m = matchGlyph(t.b, T.harfSet, 0.72);
    if(m && (!harfM || m.score > harfM.m.score)) harfM = {t, m};
  }
  if(harfM) used.add(harfM.t.b);
  for(const t of adaylar){
    if(used.has(t.b)) continue;
    const m = matchGlyph(t.b, T.sayiSet, 0.76);
    if(m && (!sayiM || m.score > sayiM.m.score)) sayiM = {t, m};
  }
  if(sayiM) used.add(sayiM.t.b);

  const hikaye = [];

  /* ── kapak ── */
  const frac = shots.reduce((s,x)=>s+x.frac,0)/shots.length;
  const k = T.kapak[frac > 0.30 ? "yogun" : frac < 0.16 ? "acik" : "denge"];
  const kapakBody = [nm(k.alt ? pick(k.alt) : k.a), nm(k.b(koyu.length + beyaz.length))];
  const oncekiSembol = gecmisSembol();
  if(oncekiSembol && T.gecmisBag)
    kapakBody.push(nm(pick(T.gecmisBag).split("{onceki}").join(oncekiSembol)));
  else if(T.gecmisIlk) kapakBody.push(nm(T.gecmisIlk));
  kapakBody.push(nm(shots.length >= 3 ? T.tamFoto : (T.eksikFoto[shots.length] || T.eksikFoto[1])));
  pages.push({kind:"kapak", blobs:[], shot:shots[0], kicker:T.ord[1] + T.ordSuffix,
              title:k.t, where:T.genel, body:kapakBody});

  let sira = 0;
  const baglaci = () => {
    const b = T.baglac[sira % T.baglac.length];
    sira++;
    return sira > 1 ? nm(b) + " " : "";
  };

  /* ── aynı fotoğrafta iki ayrı yol ── */
  for(const sh of shots){
    const y = koyu.filter(t => t.sym === "yol" && t.sh === sh && !used.has(t.b));
    if(y.length < 2) continue;
    const iki = y.slice(0,2);
    iki.forEach(t => used.add(t.b));
    const kalin = iki[0].b.area > iki[1].b.area*1.35;
    hikaye.push(T.sym.ayrilanYol.hikaye);
    pages.push({
      kind:"sym", blobs:iki.map(t=>t.b), shot:sh, kicker:T.ikiKicker,
      title:T.ikiTitle, labels:T.ikiLabels,
      where:T.ikiWhere(iki[0].pos.where, iki[1].pos.where),
      ogret:T.sym.ayrilanYol.ogret,
      tahmin:nm(pick(cogul(T.sym.ayrilanYol.tahmin))),
      body:[baglaci() + nm(T.iki[0]),
            nm(T.iki[kalin ? 1 : 2].split(":").slice(1).join(":")),
            nm(T.sym.ayrilanYol.ek)]
    });
    break;
  }

  /* ── aynı şey birden çok fotoğraftaysa en belirginini al ── */
  const grup = new Map();
  for(const t of koyu){
    if(used.has(t.b)) continue;
    const g = grup.get(t.sym);
    if(!g) grup.set(t.sym, {best:t, shots:new Set([t.sh])});
    else { g.shots.add(t.sh); if(t.guven > g.best.guven || (t.guven === g.best.guven && t.rel > g.best.rel)) g.best = t; }
  }

  let oncekiAd = null;
  const sayfaEkle = (t, s, extra, akMi, kicker) => {
    const body = [baglaci() + nm(pick(cogul(s.ana)))];
    /* bir öncekine gönderme yap: fal tek tek şekil listesi değil,
       birbirine bağlanan bir hikâyedir.                          */
    if(oncekiAd && T.zincirle && rnd() < 0.75)
      body.push(nm(pick(T.zincirle).split("{onceki}").join(oncekiAd)));
    body.push(nm(s.zon[t.pos.zone]), nm(s.yan[t.pos.side]));
    oncekiAd = String(s.ad).toLocaleLowerCase(T.loc);
    if(extra) extra.forEach(e => body.push(nm(e)));
    hikaye.push(s.hikaye);
    /* Sözlükteki anlamı da söyle: "bu sembol şu demektir". */
    const soz = (typeof sembolCoz === "function") ? sembolCoz(t.gorunen || s.ad) : null;
    if(soz && T.sembolAnlam) body.push(nm(T.sembolAnlam(soz.ad, soz.anlam, soz.ornek)));
    const kanit = t.kanit
      ? {grid:t.kanit.grid, templ:t.kanit.templ, n:t.kanit.n,
         ad:s.ad, skor:t.kanit.skor}
      : {grid:gridOf(t.b).m, ad:T.kanitSekil};
    pages.push({
      kind:"sym", blobs:[t.b], shot:t.sh, ak:akMi,
      kicker: kicker || (T.ord[Math.min(T.ord.length-1, pages.length+1)] + T.ordSuffix),
      title: vurgu(s.ad),
      where:cap(t.pos.where),
      gordugum: t.neden ? nm(T.cunku + " " + t.neden + ".") : "",
      ogret: s.ogret || (T.ogretZon[t.pos.zone] + " " + T.ogretYan[t.pos.side]),
      tahmin: s.tahmin ? nm(pick(cogul(s.tahmin))) : "",
      kanit, body
    });
  };

  /* SİLİK İZE HİÇ GİRME.
     İki süzgeç: en koyu izin yanında sönük kalanlar düşer, ve elde
     yeterince net koyu iz varsa orta tonlu soluk izlere hiç
     bakılmaz. Kullanıcının fotoğrafta zaten seçemediği bir ize ad
     vermek falın inandırıcılığını tek başına bitiriyor.           */
  if(koyu.length){
    const enKoyu = koyu.reduce((m, t) => Math.max(m, t.b.karanlik || 0), 0.001);
    const netler = koyu.filter(t => t.b.ton !== "orta").length;
    for(let q=koyu.length-1; q>=0; q--){
      const k = koyu[q].b.karanlik || 0;
      const silik = k < enKoyu*0.55;
      const soluk = koyu[q].b.ton === "orta" && netler >= 4;
      if(silik || soluk) koyu.splice(q, 1);
    }
    /* hepsini elediysek en koyu üçünü geri al: fal boş kalmasın */
    if(!koyu.length) koyu.push.apply(koyu, tagged.filter(t => !t.ak)
      .sort((a,b)=>(b.b.karanlik||0)-(a.b.karanlik||0)).slice(0,3));
  }

  /* Fincanın hep aynı köşesini okumayalım: seçilen lekeler
     birbirinden uzak olsun, farklı bölgelere dağılsın.           */
  const secilenler = [];
  const uzakMi = t => {
    const C = t.sh.cup;
    for(const v of secilenler){
      if(v.sh !== t.sh) continue;
      const d = Math.hypot(t.b.cx - v.b.cx, t.b.cy - v.b.cy);
      if(d < Math.min(C.rx, C.ry)*0.30) return false;
    }
    return true;
  };

  let say = 0;
  for(const t of koyu){
    if(say >= 8) break;
    if(!uzakMi(t)) continue;
    const g = grup.get(t.sym);
    if(!g || g.best !== t || used.has(t.b)) continue;
    used.add(t.b);
    const s = T.sym[t.sym] || T.sym.iz;
    const extra = [];
    if(t.sym === "ayrilanYol"){
      const br = t.b.branch;
      extra.push(br && br.dom !== "esit" ? T.catalKalin : T.catalEsit, s.ek);
    }
    if(g.shots.size > 1) extra.push(T.tekrar(g.shots.size));
    secilenler.push(t);
    sayfaEkle(t, s, extra, false, null);
    say++;
  }

  /* ── telvenin bıraktığı boşluk ── */
  const akGrup = new Map();
  for(const t of beyaz){
    if(!akGrup.has(t.sym) || t.rel > akGrup.get(t.sym).rel) akGrup.set(t.sym, t);
  }
  let akSay = 0;
  for(const t of beyaz){
    if(akSay >= 1) break;
    if(t.sym !== "akNokta") continue;
    if(akGrup.get(t.sym) !== t) continue;
    const s = T.symAk[t.sym];
    if(!s) continue;
    sayfaEkle(t, s, null, true, T.akKicker);
    akSay++;
  }

  /* ── harf ── */
  if(harfM){
    const h = harfM.m.ch, t = harfM.t;
    pages.push({
      kind:"sym", blobs:[t.b], shot:t.sh, kicker:T.harfKicker,
      title:T.harfTitle(h), where:cap(t.pos.where),
      ogret:T.harfOgret,
      kanit:{grid:harfM.m.grid, templ:harfM.m.templ, ad:T.kanitHarf(h), skor:Math.round(harfM.m.score*100)},
      body:[baglaci() + nm(T.harfAna(h)), nm(T.harfYan[t.pos.side](h)), nm(T.harfSon)]
    });
  }

  /* ── sayı ──
     Eskiden burada, rakam bulunamazsa şekil sayısından uydurma bir
     "sayı" sayfası açılıyordu. Kaldırıldı: fincanda sayı yoksa yoktur. */
  if(sayiM){
    const num = sayiM.m.ch, t = sayiM.t;
    const kap = pick(T.zaman);
    pages.push({
      kind:"sym", blobs:[t.b], shot:t.sh, kicker:T.sayiKicker,
      title:T.sayiTitle(num), where:cap(t.pos.where),
      ogret:T.sayiOgret,
      kanit:{grid:sayiM.m.grid, templ:sayiM.m.templ, ad:T.kanitSayi(num), skor:Math.round(sayiM.m.score*100)},
      body:[nm(T.sayiAna(num)), T.sayiOrta(T.sayiZon[t.pos.zone], num, kap), nm(T.sayiSon(num))]
    });
  }
  /* Harf ya da rakam çıkmadıysa bundan hiç söz etmiyoruz. Falcı
     yapamadığını anlatmaz; olmayan şey zaten konuşulmaz.        */

  serpistir(pages, T);
  pages.push(kapanisSayfasi(T, hikaye, null,
    pages.filter(p => p.kind === "sym").map(p => p.title.replace(/<[^>]+>/g,""))));
}

/* ══════════════════ SAHNE ══════════════════ */

const stage  = document.getElementById("stage");
const cPhoto = document.getElementById("cPhoto");
const cVeil  = document.getElementById("cVeil");
let SW = 0, SH = 0, DPR = 1;
let view = {k:1, cx:0, cy:0}, target = {k:1, cx:0, cy:0};
let arcT = 0, rafId = 0;

function sizeStage(){
  const r = stage.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = Math.max(1, Math.round(r.width)); SH = Math.max(1, Math.round(r.height));
  for(const c of [cPhoto, cVeil]){
    c.width = SW*DPR; c.height = SH*DPR;
    c.getContext("2d").setTransform(DPR,0,0,DPR,0,0);
  }
}
function baseScale(sh){ return (Math.min(SW,SH)*0.94) / (Math.max(sh.cup.rx, sh.cup.ry)*2); }

function viewFor(p){
  const sh = p.shot;
  if(!p.blobs.length) return {k:1, cx:sh.cup.cx, cy:sh.cup.cy};
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(const b of p.blobs){
    x0=Math.min(x0,b.x0); y0=Math.min(y0,b.y0);
    x1=Math.max(x1,b.x0+b.bw); y1=Math.max(y1,b.y0+b.bh);
  }
  const want = (Math.min(SW,SH)*0.46) / (Math.max(x1-x0, y1-y0)*baseScale(sh));
  return {k:Math.max(1, Math.min(3.6, want)), cx:(x0+x1)/2, cy:(y0+y1)/2};
}

function applyTf(ctx, v, sh){
  const s = baseScale(sh)*v.k;
  let tx = SW/2 - v.cx*s, ty = SH/2 - v.cy*s;
  const iw = sh.work.w*s, ih = sh.work.h*s;
  tx = iw >= SW ? Math.min(0, Math.max(SW-iw, tx)) : (SW-iw)/2;
  ty = ih >= SH ? Math.min(0, Math.max(SH-ih, ty)) : (SH-ih)/2;
  ctx.setTransform(s*DPR, 0, 0, s*DPR, tx*DPR, ty*DPR);
  return {s, tx, ty};
}

function glowCanvas(b, renk){
  if(b._glow) return b._glow;
  const c = document.createElement("canvas");
  c.width = b.bw; c.height = b.bh;
  const ctx = c.getContext("2d");
  const im = ctx.createImageData(b.bw, b.bh);
  for(let i=0;i<b.mask.length;i++){
    if(!b.mask[i]) continue;
    const p = i*4;
    im.data[p]=renk[0]; im.data[p+1]=renk[1]; im.data[p+2]=renk[2]; im.data[p+3]=255;
  }
  ctx.putImageData(im, 0, 0);
  b._glow = c;
  return c;
}

function draw(){
  const p = pages[curPage]; if(!p || !p.shot) return;
  const sh = p.shot;
  const pc = cPhoto.getContext("2d"), vc = cVeil.getContext("2d");
  const renk = p.ak ? "#7FE3C2" : "#FFD466";

  pc.setTransform(DPR,0,0,DPR,0,0);
  pc.fillStyle = "#0D0609"; pc.fillRect(0,0,SW,SH);
  const tf = applyTf(pc, view, sh);
  pc.imageSmoothingQuality = "high";
  pc.drawImage(sh.work.canvas, 0, 0);
  pc.setTransform(DPR,0,0,DPR,0,0);

  vc.setTransform(DPR,0,0,DPR,0,0);
  vc.clearRect(0,0,SW,SH);

  /* fincanın dışını kapat; içerisi olduğu gibi kalsın ki telve net görünsün */
  vc.save();
  vc.fillStyle = "rgba(10,5,8,.92)";
  vc.beginPath();
  vc.rect(0,0,SW,SH);
  vc.ellipse(sh.cup.cx*tf.s + tf.tx, sh.cup.cy*tf.s + tf.ty,
             sh.cup.rx*tf.s, sh.cup.ry*tf.s, 0, 0, Math.PI*2, true);
  vc.fill("evenodd");
  vc.restore();

  /* İşaret basit bir çerçeve. Lekenin sınırını tek tek çizmiyoruz:
     telve düzgün sınır vermez, çizince yanlış yerde duruyormuş gibi
     görünür. Kutu "şuraya bak" demek için yeter.                   */
  const marks = p.blobs.map(b => {
    const pay = b.kutuMod ? 4 : Math.max(10, Math.min(b.bw, b.bh)*0.22*tf.s + 8);
    return {
      b,
      x: b.x0*tf.s + tf.tx - pay,
      y: b.y0*tf.s + tf.ty - pay,
      w: b.bw*tf.s + pay*2,
      h: b.bh*tf.s + pay*2
    };
  });

  if(marks.length){
    vc.save();
    vc.strokeStyle = renk;
    vc.lineWidth = 2.6;
    vc.lineJoin = "round";
    vc.shadowColor = "rgba(0,0,0,.85)";
    vc.shadowBlur = 6;
    for(const m of marks){
      const yuvarlak = Math.abs(m.w - m.h) < Math.max(m.w, m.h)*0.22;
      vc.beginPath();
      if(yuvarlak) vc.ellipse(m.x + m.w/2, m.y + m.h/2, m.w/2, m.h/2, 0, 0, Math.PI*2);
      else         kutuCizRound(vc, m.x, m.y, m.w, m.h, 10);
      vc.stroke();
    }
    vc.restore();
  }
  placeLabels(p, marks);
}

/* köşeleri yumuşak dikdörtgen */
function kutuCizRound(c, x, y, w, h, r){
  const k = Math.min(r, w/2, h/2);
  c.moveTo(x+k, y);
  c.lineTo(x+w-k, y); c.quadraticCurveTo(x+w, y, x+w, y+k);
  c.lineTo(x+w, y+h-k); c.quadraticCurveTo(x+w, y+h, x+w-k, y+h);
  c.lineTo(x+k, y+h); c.quadraticCurveTo(x, y+h, x, y+h-k);
  c.lineTo(x, y+k); c.quadraticCurveTo(x, y, x+k, y);
}

function placeLabels(p, marks){
  stage.querySelectorAll(".lbl").forEach(e=>e.remove());
  if(!marks.length) return;
  const ad = p.kind === "sym" ? p.title.replace(/<[^>]+>/g,"") : "";
  marks.forEach((m, i)=>{
    const el = document.createElement("div");
    el.className = "lbl";
    el.textContent = p.labels ? p.labels[i] : (marks.length > 1 ? (i+1) + ". " + ad : ad);
    let ly = m.y - 14;
    if(ly < 18) ly = m.y + m.h + 16;
    el.style.left = Math.max(60, Math.min(SW-60, m.x + m.w/2)) + "px";
    el.style.top = ly + "px";
    stage.appendChild(el);
    el.classList.add("show");
  });
}

function loop(){
  if(!surukleniyor){
    const e = 0.12;
    view.k += (target.k - view.k)*e;
    view.cx += (target.cx - view.cx)*e;
    view.cy += (target.cy - view.cy)*e;
  }
  draw();
  rafId = requestAnimationFrame(loop);
}

/* ══════════════════ SAYFA GÖSTERİMİ ══════════════════ */

const slot   = document.getElementById("page-slot");
const dotsEl = document.getElementById("dots");
const pgnum  = document.getElementById("pgnum");
const corner = document.getElementById("corner");

function gridSvg(m, renk, n){
  const N = n || Math.round(Math.sqrt(m.length));
  let r = "";
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if(m[y*N+x]) r += '<rect x="'+x+'" y="'+y+'" width="1.06" height="1.06"/>';
  return '<svg viewBox="0 0 '+N+' '+N+'" fill="'+renk+'" aria-hidden="true">'+r+"</svg>";
}
const kacir = s => String(s == null ? "" : s)
  .split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;");
function kanitHtml(k, T, ak){
  let h = '<div class="kanit">';
  h += '<figure><div class="k-box">' + gridSvg(k.grid, ak ? "#9FD8C4" : "#EBD49A") + "</div>" +
       "<figcaption>" + T.kanitGordum + "</figcaption></figure>";
  if(k.templ){
    h += '<span class="k-eq">&asymp;</span>';
    h += '<figure><div class="k-box">' + gridSvg(k.templ, "#CE8279") + "</div>" +
         "<figcaption>" + k.ad + "</figcaption></figure>";
    /* yüzde göstermiyoruz: fal sayısal analiz değildir */
  } else {
    h += '<span class="k-score">' + k.ad + "</span>";
  }
  return h + "</div>";
}

function showPage(i){
  curPage = Math.max(0, Math.min(pages.length-1, i));
  const p = pages[curPage], T = P();
  target = viewFor(p);

  let html = '<p class="pg-kicker">' + p.kicker + "</p>";
  html += '<h2 class="pg-title">' + p.title + "</h2>";
  if(p.where) html += '<p class="pg-where">' + p.where + "</p>";
  if(p.kanit) html += kanitHtml(p.kanit, T, p.ak);
  if(p.gordugum)
    html += '<div class="gordum"><b>' + T.gordugumBaslik + "</b><p>" + p.gordugum + "</p></div>";
  html += '<div class="pg-body">';
  p.body.forEach((t,ix)=>{ html += "<p" + (ix===0 ? ' class="first"' : "") + ">" + t + "</p>"; });
  html += "</div>";
  if(p.tahmin)
    html += '<div class="tahmin"><b>' + T.tahminBaslik + "</b><p>" + p.tahmin + "</p></div>";
  if(p.ogret)
    html += '<details class="ogret"><summary>' + T.ogretBaslik + "</summary><p>" + p.ogret + "</p></details>";

  if(p.kind === "son"){
    html += '<div class="summary">';
    p.liste.forEach((n,ix)=>{
      html += '<div class="sum-row"><span>' + String(ix+1).padStart(2,"0") + "</span><b>" + n + "</b></div>";
    });
    html += "</div>";
    html += '<div class="end-actions">' +
            '<button class="btn primary" id="b-again" type="button">' + T.ui.btnAgain + "</button>" +
            '<button class="btn" id="b-copy" type="button">' + T.ui.btnCopy + "</button></div>";
  }
  slot.innerHTML = html;
  slot.classList.remove("fade-in"); void slot.offsetWidth; slot.classList.add("fade-in");

  dotsEl.innerHTML = pages.map((_,ix)=>'<i class="'+(ix===curPage?"on":"")+'"></i>').join("");
  pgnum.textContent = String(curPage+1).padStart(2,"0") + " / " + String(pages.length).padStart(2,"0");
  const yer = p.blobs.length ? T.ui.marked : T.ui.whole;
  corner.textContent = shots.length > 1 ? T.photoN(shotIx(p.shot)+1) + " · " + yer : yer;

  document.getElementById("b-prev").disabled = curPage === 0;
  document.getElementById("b-next").disabled = curPage === pages.length-1;
  const again = document.getElementById("b-again"); if(again) again.addEventListener("click", reset);
  const copy  = document.getElementById("b-copy");  if(copy)  copy.addEventListener("click", copyFal);
}

function copyFal(){
  const T = P();
  const duz = s => String(s || "").replace(/<[^>]+>/g,"")
    .split("&lt;").join("<").split("&gt;").join(">").split("&amp;").join("&");
  const txt = pages.map(p => {
    let s = duz(p.title).toLocaleUpperCase(T.loc) + "\n";
    if(p.where) s += duz(p.where) + "\n";
    if(p.gordugum) s += "\n" + T.gordugumBaslik + ": " + duz(p.gordugum);
    s += "\n\n" + p.body.map(duz).join("\n\n");
    if(p.tahmin) s += "\n\n" + T.tahminBaslik + ": " + duz(p.tahmin);
    if(p.ogret)  s += "\n\n" + T.ogretBaslik + " " + duz(p.ogret);
    return s;
  }).join("\n\n— — —\n\n");
  navigator.clipboard.writeText(txt).then(()=>toast(P().ui.copied), ()=>toast(P().ui.copyFail));
}
function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("on"), 3200);
}

/* ══════════════════ AKIŞ ══════════════════ */

const screens = {
  lang:document.getElementById("scr-lang"),
  ad:document.getElementById("scr-ad"),
  cam:document.getElementById("scr-cam"),
  frame:document.getElementById("scr-frame"),
  intro:document.getElementById("scr-intro"),
  setup:document.getElementById("scr-setup"),
  ritual:document.getElementById("scr-ritual"),
  read:document.getElementById("scr-read")
};
function go(name){
  if(name !== "cam") camStopla();
  for(const k in screens) screens[k].classList.toggle("on", k === name);
  document.getElementById("langbar").hidden = (name === "cam");
  window.scrollTo(0,0);
}

/* ---- uygulama içi kamera ---- */
let camStream = null;
let camHedef = -1;              // -1 yeni, >=0 o sıradakini değiştir

function camStopla(){
  if(!camStream) return;
  camStream.getTracks().forEach(t => t.stop());
  camStream = null;
  const v = document.getElementById("cam");
  if(v) v.srcObject = null;
}

async function cekBaslat(hedef){
  camHedef = (typeof hedef === "number") ? hedef : -1;
  if(camHedef < 0 && shots.length >= 3) return;
  const md = navigator.mediaDevices;
  const guvenli = (typeof window.isSecureContext === "undefined") ? true : window.isSecureContext;
  if(!md || !md.getUserMedia || !guvenli){ document.getElementById("f-cam").click(); return; }
  try{
    camStream = await md.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1920} },
      audio:false
    });
    const v = document.getElementById("cam");
    v.srcObject = camStream;
    v.setAttribute("playsinline", "");
    await v.play();
    camYonlendir();
    go("cam");
  }catch(err){
    camStopla();
    if(err && (err.name === "NotAllowedError" || err.name === "SecurityError")) toast(P().ui.camDenied);
    document.getElementById("f-cam").click();
  }
}

/* çekilecek karenin sırasına göre halka ve ipucu */
function camSira(){
  return camHedef >= 0 ? camHedef : Math.min(2, shots.length);
}
function camYonlendir(){
  const T = P(), i = camSira();
  const halka = document.querySelector(".camring");
  if(halka) halka.classList.toggle("serbest", i > 0);
  const ip = document.getElementById("camhint");
  if(ip) ip.textContent = (T.ui.camHints && T.ui.camHints[i]) || T.ui.camHint;
  const et = document.getElementById("camaci");
  if(et) et.textContent = (T.acilar && T.acilar[i]) || "";
}

function camCek(){
  const v = document.getElementById("cam");
  const vw = v.videoWidth || 0, vh = v.videoHeight || 0;
  if(!vw || !vh){ toast(P().ui.badPhoto); return; }

  /* Ekranda ne görüyorsan o çekilir: halkanın video piksellerindeki
     karşılığını buluyoruz. Video object-fit:cover ile gösteriliyor,
     yani taşan kenarlar kırpılmış durumda; hesabı ona göre yapıyoruz. */
  const rv = v.getBoundingClientRect();
  const halka = document.querySelector(".camring").getBoundingClientRect();
  let k, sx, sy;
  if(rv.width > 0 && rv.height > 0){
    const s = Math.max(rv.width/vw, rv.height/vh);
    const ox = (rv.width - vw*s)/2, oy = (rv.height - vh*s)/2;
    const cx = (halka.left - rv.left + halka.width/2  - ox)/s;
    const cy = (halka.top  - rv.top  + halka.height/2 - oy)/s;
    k = Math.round(Math.min(halka.width, halka.height)/s * 1.04);   // kenardan azıcık pay
    k = Math.max(96, Math.min(k, Math.min(vw, vh)));
    sx = Math.round(cx - k/2);
    sy = Math.round(cy - k/2);
  } else {
    k = Math.min(vw, vh);
    sx = (vw-k)/2; sy = (vh-k)/2;
  }
  sx = Math.max(0, Math.min(sx, vw - k));
  sy = Math.max(0, Math.min(sy, vh - k));

  const c = document.createElement("canvas");
  c.width = c.height = k;
  c.getContext("2d").drawImage(v, sx, sy, k, k, 0, 0, k, k);
  camStopla();
  loadUrl(c.toDataURL("image/jpeg", 0.92), true);
}

/* ---- fincanı çerçeveleme ---- */
const framer  = document.getElementById("framer");
const frameCv = document.getElementById("frame-cv");
let fImg = null, fUrl = "", fW = 0, fH = 0, fDpr = 1;
let fEl = {cx:0, cy:0, rx:0, ry:0};
let fFit = {s:1, ox:0, oy:0};
let fTut = null;

function frameBaslat(img, url, hazir){
  fImg = img; fUrl = url;
  go("frame");
  requestAnimationFrame(()=>{
    const r = framer.getBoundingClientRect();
    fDpr = Math.min(2, window.devicePixelRatio || 1);
    fW = Math.max(1, Math.round(r.width)); fH = Math.max(1, Math.round(r.height));
    frameCv.width = fW*fDpr; frameCv.height = fH*fDpr;
    frameCv.getContext("2d").setTransform(fDpr,0,0,fDpr,0,0);
    const s = Math.min(fW/img.width, fH/img.height);
    fFit = {s, ox:(fW - img.width*s)/2, oy:(fH - img.height*s)/2};
    const gw = img.width*s, gh = img.height*s;
    if(hazir){
      const t = Math.min(gw, gh)*0.474;
      fEl = {cx:fW/2, cy:fH/2, rx:t, ry:t};
    } else {
      /* galeriden gelen karede fincan çoğu zaman ortada değil; kaba bir
         tahmin yapıp halkayı oraya koyuyoruz, kullanıcı düzeltiyor.  */
      let t = Math.min(fW, fH)*0.34, cx = fW/2, cy = fH/2;
      try{
        const kucuk = toWork(img);
        const tahmin = findCup(grayOf(kucuk.data), kucuk.w, kucuk.h);
        const k = (img.width*s) / kucuk.w;
        const rx = tahmin.rx*k, ry = tahmin.ry*k;
        if(rx > gw*0.12 && rx < gw*0.52 && ry > gh*0.12 && ry < gh*0.52){
          cx = fFit.ox + tahmin.cx*k;
          cy = fFit.oy + tahmin.cy*k;
          fEl = {cx, cy, rx, ry};
          frameCiz();
          return;
        }
      }catch(err){}
      fEl = {cx, cy, rx:t, ry:t};
    }
    frameCiz();
  });
}

function frameCiz(){
  const c = frameCv.getContext("2d");
  c.setTransform(fDpr,0,0,fDpr,0,0);
  c.fillStyle = "#0D0609"; c.fillRect(0,0,fW,fH);
  c.drawImage(fImg, fFit.ox, fFit.oy, fImg.width*fFit.s, fImg.height*fFit.s);

  c.save();
  c.fillStyle = "rgba(10,5,8,.74)";
  c.beginPath();
  c.rect(0,0,fW,fH);
  c.ellipse(fEl.cx, fEl.cy, fEl.rx, fEl.ry, 0, 0, Math.PI*2, true);
  c.fill("evenodd");
  c.restore();

  c.strokeStyle = "#EBD49A"; c.lineWidth = 2;
  c.beginPath(); c.ellipse(fEl.cx, fEl.cy, fEl.rx, fEl.ry, 0, 0, Math.PI*2); c.stroke();
  c.strokeStyle = "rgba(235,212,154,.28)"; c.lineWidth = 1;
  c.beginPath(); c.ellipse(fEl.cx, fEl.cy, fEl.rx*0.55, fEl.ry*0.55, 0, 0, Math.PI*2); c.stroke();

  for(const hh of [[fEl.cx+fEl.rx, fEl.cy], [fEl.cx, fEl.cy+fEl.ry]]){
    c.fillStyle = "#EBD49A";
    c.beginPath(); c.arc(hh[0], hh[1], 10, 0, 7); c.fill();
    c.fillStyle = "#20110A";
    c.beginPath(); c.arc(hh[0], hh[1], 3.2, 0, 7); c.fill();
  }
}

function frameNokta(ev){
  const r = frameCv.getBoundingClientRect();
  return {x:ev.clientX - r.left, y:ev.clientY - r.top};
}
frameCv.addEventListener("pointerdown", ev=>{
  const p = frameNokta(ev);
  try{ frameCv.setPointerCapture(ev.pointerId); }catch(e){}
  if(Math.hypot(p.x-(fEl.cx+fEl.rx), p.y-fEl.cy) < 28) fTut = {mod:"rx"};
  else if(Math.hypot(p.x-fEl.cx, p.y-(fEl.cy+fEl.ry)) < 28) fTut = {mod:"ry"};
  else fTut = {mod:"tasi", dx:p.x-fEl.cx, dy:p.y-fEl.cy};
});
frameCv.addEventListener("pointermove", ev=>{
  if(!fTut) return;
  const p = frameNokta(ev);
  if(fTut.mod === "rx") fEl.rx = Math.max(28, Math.min(fW*0.64, p.x - fEl.cx));
  else if(fTut.mod === "ry") fEl.ry = Math.max(28, Math.min(fH*0.64, p.y - fEl.cy));
  else { fEl.cx = p.x - fTut.dx; fEl.cy = p.y - fTut.dy; }
  frameCiz();
});
for(const e of ["pointerup","pointercancel","pointerleave"])
  frameCv.addEventListener(e, ()=>{ fTut = null; });

document.getElementById("b-frame-ok").addEventListener("click", ()=>{

    cy:((fEl.cy - fFit.oy)/s)*k,

});

function renderTray(){
  const T = P();
  tray.innerHTML = "";
  for(let i=0;i<3;i++){
    const s = shots[i];
    const d = document.createElement("div");
    d.className = "slot" + (s ? "" : " empty");
    const aci = '<p class="aci">' + (T.acilar[i] || "") + "<i>" + (T.aciTarif[i] || "") + "</i></p>";
    if(s){
      d.innerHTML = aci +
        '<div class="disc"><img src="' + s.url + '" alt=""><span class="num">' + (i+1) + "</span></div>" +
        '<span class="badge ' + s.q.level + '"><b></b>' + T.ui["badge_" + s.q.level] + "</span>" +
        '<div class="acts">' +
          '<button type="button" data-re="' + i + '">' + T.ui.retake + "</button>" +
          '<button type="button" data-fr="' + i + '">' + T.ui.reframe + "</button>" +
          '<button type="button" data-rm="' + i + '">' + T.ui.remove + "</button>" +
        "</div>";
    } else {
      d.innerHTML = aci + '<div class="disc"><span class="plus">+</span></div><span class="badge">' + (i+1) + "</span>";
    }
    tray.appendChild(d);
  }
  tray.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click", ()=>{
    shots.splice(Number(b.dataset.rm), 1); renderTray();
  }));
  tray.querySelectorAll("[data-re]").forEach(b=>b.addEventListener("click", ()=>{
    cekBaslat(Number(b.dataset.re));
  }));
  tray.querySelectorAll("[data-fr]").forEach(b=>b.addEventListener("click", ()=>{
    const i = Number(b.dataset.fr);
    camHedef = i;
    const img = new Image();
    img.onload = ()=>frameBaslat(img, shots[i].url);
    img.onerror = ()=>toast(P().ui.badPhoto);
    img.src = shots[i].url;
  }));

  const dolu = shots.length >= 3;
  for(const id of ["add-cam","add-lib"]){
    const el = document.getElementById(id);
    el.style.opacity = dolu ? ".28" : "";
    el.style.pointerEvents = dolu ? "none" : "";
    if("disabled" in el) el.disabled = dolu;
  }

  const sorun = shots.map((s,i)=>({s,i})).filter(o => o.s.q.code);
  let cls = "", msg = "";
  if(!shots.length){ msg = T.ui.needOne; cls = "warn"; }
  else if(sorun.some(o => o.s.q.level === "kotu")){
    const o = sorun.find(x => x.s.q.level === "kotu");
    msg = T.q[o.s.q.code](o.i+1, T.yonAd[o.s.q.yon] || ""); cls = "bad";
  } else if(sorun.length){
    msg = T.q.soft(sorun[0].i+1, ""); cls = "warn";
  } else {
    msg = shots.length < 3 ? T.ui.hintMore : T.ui.allGood; cls = "";
  }
  trayNote.className = "tray-note " + cls;
  trayNote.textContent = msg;

  const ph = document.getElementById("prev-img");
  if(shots.length) ph.src = shots[0].url;
  document.getElementById("b-open").disabled = shots.length === 0;
}
