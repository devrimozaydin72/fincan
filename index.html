<style>
  :root{color-scheme:dark;}
  html,body{margin:0;padding:0;background:#180C12;}
  body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;}
  img{max-width:100%;}
  [hidden]{display:none !important;}

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
  :root{
    --night:#180C12;
    --night-2:#21111A;
    --ink:#F3E7DD;
    --ink-2:#CBAEA2;
    --ink-3:#9A7F77;
    --gold:#D4A843;
    --gold-soft:#EBD49A;
    --gold-dim:rgba(212,168,67,.28);
    --gold-faint:rgba(212,168,67,.14);
    --rose:#CE8279;
    --ok:#7FBE8E;
    --warn:#E0B457;
    --bad:#D97A6C;
    --display:"Bodoni Moda",Didot,Georgia,serif;
    --body:"Cormorant Garamond",Georgia,serif;
    --ui:"Jost","Futura","Century Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--night);}
  body{
    color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.62;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(212,168,67,.10), transparent 62%),
      radial-gradient(90% 60% at 110% 105%, rgba(206,130,121,.09), transparent 60%);
  }
  .shell{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-inline:22px;}
  @media (max-width:560px){ .shell{padding-inline:18px;} }
  button{font-family:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .screen{display:none;}
  .screen.on{display:block;}

  .kicker{
    font-family:var(--ui);font-weight:300;font-size:11px;
    letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:0;
  }
  h1.logo{
    font-family:var(--display);font-weight:400;
    font-size:clamp(56px,15vw,104px);line-height:.9;letter-spacing:.02em;
    margin:14px 0 0;color:var(--ink);
  }
  h1.logo em{font-style:italic;color:var(--gold-soft);}
  .lede{font-size:clamp(19px,4.4vw,23px);color:var(--ink-2);max-width:30ch;margin:18px auto 0;line-height:1.5;}
  .cupmark{width:clamp(96px,26vw,138px);height:auto;display:block;margin:0 auto;}
  .rule-orn{display:flex;align-items:center;gap:12px;justify-content:center;margin:30px 0 0;width:min(320px,80%);}
  .rule-orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
  .rule-orn b{color:var(--gold);font-size:9px;letter-spacing:.4em;font-family:var(--ui);font-weight:300;}

  .actions{display:flex;flex-direction:column;gap:12px;margin-top:34px;width:min(360px,100%);}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:var(--ui);font-weight:400;font-size:13.5px;letter-spacing:.16em;
    text-transform:uppercase;padding:16px 22px;border-radius:2px;cursor:pointer;
    border:1px solid var(--gold-dim);background:transparent;color:var(--ink);
    transition:background .2s ease,border-color .2s ease,opacity .2s ease;
  }
  .btn:hover:not(:disabled){border-color:var(--gold);background:rgba(212,168,67,.07);}
  .btn.primary{background:linear-gradient(180deg,#E2BC63,#C79B35);border-color:transparent;color:#20110A;font-weight:500;}
  .btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#EFCC7A,#D3A84A);}
  .btn.ghost{border-color:rgba(212,168,67,.16);color:var(--ink-2);font-size:12px;}
  .btn:disabled{opacity:.3;cursor:default;}
  .btn svg{width:16px;height:16px;flex:none;}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

  /* dil çubuğu */
  .langbar{
    position:fixed;top:14px;right:14px;z-index:40;display:flex;gap:4px;
    background:rgba(24,12,18,.75);border:1px solid var(--gold-faint);
    border-radius:99px;padding:3px;backdrop-filter:blur(8px);
  }
  .langbar button{
    background:transparent;border:0;border-radius:99px;cursor:pointer;
    font-family:var(--ui);font-size:10.5px;letter-spacing:.16em;
    color:var(--ink-3);padding:5px 11px;transition:all .2s ease;
  }
  .langbar button:hover{color:var(--gold-soft);}
  .langbar button[aria-pressed=true]{background:var(--gold);color:#20110A;font-weight:500;}
  .langbar .sesbtn{font-size:14px;padding:5px 10px;line-height:1;}
  .langbar .sesbtn[aria-pressed=false]{opacity:.5;}
  .langbar[hidden]{display:none !important;}

  /* dil seçimi */
  #scr-lang .shell{padding-block:clamp(48px,13vw,92px) 60px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .pick-q{font-family:var(--display);font-size:clamp(26px,6.5vw,36px);font-weight:400;margin:28px 0 0;}
  .pick-q span{color:var(--gold);font-style:italic;padding:0 6px;}

  /* giriş */
  #scr-intro .shell{padding-block:clamp(34px,8vw,60px) 46px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .tips{list-style:none;padding:0;margin:38px 0 0;display:grid;gap:14px;text-align:left;width:min(420px,100%);}
  .tips li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:baseline;color:var(--ink-2);font-size:17px;line-height:1.45;}
  .tips li i{font-family:var(--display);font-size:15px;color:var(--gold);font-style:italic;}
  .fineprint{
    margin:40px 0 0;font-family:var(--ui);font-weight:300;font-size:10.5px;
    letter-spacing:.12em;line-height:1.8;color:var(--ink-3);max-width:34ch;text-transform:uppercase;
  }

  /* fotoğraf tepsisi */
  #scr-setup .shell{padding-block:28px 48px;max-width:600px;text-align:center;}
  .tray{display:flex;gap:12px;justify-content:center;margin:26px 0 0;flex-wrap:wrap;}
  .slot{width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .slot .disc{
    position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;
    border:1px solid var(--gold-dim);background:var(--night-2);
    display:grid;place-items:center;
  }
  .slot.empty .disc{border-style:dashed;border-color:rgba(212,168,67,.22);}
  .slot .disc img{width:100%;height:100%;object-fit:cover;display:block;}
  .slot .disc .num{
    position:absolute;top:5px;left:5px;width:19px;height:19px;border-radius:50%;
    background:rgba(24,12,18,.8);color:var(--gold-soft);font-family:var(--ui);
    font-size:9.5px;display:grid;place-items:center;border:1px solid var(--gold-faint);
  }
  .slot .disc .x{
    position:absolute;top:4px;right:4px;width:21px;height:21px;border-radius:50%;
    background:rgba(24,12,18,.85);border:1px solid var(--gold-faint);color:var(--ink-2);
    font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;
  }
  .slot .disc .x:hover{color:var(--bad);border-color:var(--bad);}
  .slot .disc .plus{font-family:var(--display);font-size:30px;color:rgba(212,168,67,.4);}
  .slot .badge{
    font-family:var(--ui);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    display:flex;align-items:center;gap:5px;color:var(--ink-3);
  }
  .slot .badge b{width:6px;height:6px;border-radius:50%;display:block;}
  .badge.ok b{background:var(--ok);} .badge.ok{color:var(--ok);}
  .badge.orta b{background:var(--warn);} .badge.orta{color:var(--warn);}
  .badge.kotu b{background:var(--bad);} .badge.kotu{color:var(--bad);}

  .tray-note{
    margin:20px auto 0;max-width:40ch;font-size:17px;line-height:1.5;
    color:var(--ink-2);min-height:1.5em;
  }
  .tray-note.warn{color:var(--warn);}
  .tray-note.bad{color:var(--bad);}
  .addrow{display:flex;gap:10px;justify-content:center;margin:22px 0 0;flex-wrap:wrap;}
  .addrow .btn{flex:0 1 190px;padding:12px 16px;font-size:11.5px;letter-spacing:.13em;}

  .cup-pick{position:relative;width:min(300px,74vw);margin:34px auto 0;}
  .ring-ph{
    width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;
    border:1px solid var(--gold-dim);
    box-shadow:0 0 0 7px rgba(212,168,67,.05), 0 24px 60px rgba(0,0,0,.5);
  }
  .ring-ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .hbtn{
    position:absolute;width:46px;height:46px;border-radius:50%;
    border:1px solid var(--gold-dim);background:var(--night-2);color:var(--ink-2);
    font-family:var(--ui);font-size:10px;letter-spacing:.1em;cursor:pointer;
    display:grid;place-items:center;transition:all .2s ease;
  }
  .hbtn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .hbtn[aria-pressed=true]{background:var(--gold);color:#20110A;border-color:var(--gold);font-weight:500;}
  .hbtn.t{top:-23px;left:50%;transform:translateX(-50%);}
  .hbtn.b{bottom:-23px;left:50%;transform:translateX(-50%);}
  .hbtn.l{left:-23px;top:50%;transform:translateY(-50%);}
  .hbtn.r{right:-23px;top:50%;transform:translateY(-50%);}
  .ask{font-family:var(--display);font-size:clamp(23px,5.6vw,30px);margin:0;font-weight:400;}
  .ask-sub{color:var(--ink-3);font-size:16px;margin:8px 0 0;}
  .sec-head{margin:44px 0 0;}

  /* ritüel */
  #scr-ritual .shell{padding-block:80px;text-align:center;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
  /* Ritüelde söylenen yer fotoğrafın üstünde gösterilir: "dibe
     bakıyorum" derken halka fincanın dibine iner. Fotoğraf tepeden
     çekildiği için ağız dıştaki halka, dip ortadaki noktadır.     */
  .ritual-goz{position:relative;width:min(58vw,228px);aspect-ratio:1;border-radius:50%;
    overflow:hidden;border:1px solid var(--gold-dim);box-shadow:0 12px 44px rgba(0,0,0,.30);}
  .ritual-foto{position:absolute;inset:0;background-size:cover;background-position:center;}
  .ritual-goz.bos .ritual-foto{background:radial-gradient(circle at 50% 42%,#31241a,#160f0a);}
  .ritual-isaret{position:absolute;inset:0;width:100%;height:100%;}
  .ritual-halka{fill:rgba(214,168,86,.12);stroke:var(--gold);stroke-width:.9;
    transition:cx .85s cubic-bezier(.4,0,.2,1),cy .85s cubic-bezier(.4,0,.2,1),r .85s cubic-bezier(.4,0,.2,1);}
  .ritual-tara{position:absolute;left:0;right:0;top:-36%;height:36%;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(214,168,86,.20),transparent);
    animation:tara 3.4s ease-in-out infinite;}
  @keyframes tara{0%{top:-36%}100%{top:100%}}
  @media (prefers-reduced-motion:reduce){.ritual-tara{animation:none;opacity:0;}}
  .spin{width:104px;height:104px;}
  .spin circle{fill:none;stroke:var(--gold-dim);stroke-width:1;}
  .spin .arc{fill:none;stroke:var(--gold);stroke-width:1.4;stroke-linecap:round;transform-origin:52px 52px;animation:turn 2.4s linear infinite;}
  @keyframes turn{to{transform:rotate(360deg);}}
  .ritual-line{font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink-2);margin:0;min-height:1.6em;}
  .ritual-kalan{font-family:var(--ui);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);margin:14px 0 0;font-variant-numeric:tabular-nums;min-height:1.4em;}

  /* okuma */
  #scr-read .shell{padding-block:18px 0;}
  .reader{display:grid;grid-template-columns:minmax(0,1fr);}
  @media (min-width:900px){
    .reader{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:44px;align-items:start;}
    .stage-col{position:sticky;top:18px;}
  }
  .stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:3px;overflow:hidden;background:#0D0609;border:1px solid var(--gold-faint);cursor:grab;touch-action:none;}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .stage .lbl{
    position:absolute;transform:translate(-50%,-50%);
    font-family:var(--display);font-size:15px;letter-spacing:.06em;
    color:#1C0F07;background:var(--gold-soft);padding:3px 11px;border-radius:1px;
    white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s ease;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .stage .lbl.show{opacity:1;}
  .stage .sesdug{
    position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--gold-dim);background:rgba(10,5,8,.6);color:var(--gold-soft);
    font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0;
    backdrop-filter:blur(4px);transition:all .2s ease;
  }
  .stage .sesdug:hover{border-color:var(--gold);background:rgba(10,5,8,.85);}
  .stage .sesdug[aria-pressed=true]{color:var(--gold);border-color:var(--gold-dim);}
  .stage .corner{
    position:absolute;font-family:var(--ui);font-size:9.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);bottom:12px;left:14px;pointer-events:none;
    text-shadow:0 1px 8px rgba(0,0,0,.9);
  }
  .txt{padding:26px 2px 0;}
  @media (min-width:900px){ .txt{padding-top:6px;} }
  .pg-kicker{font-family:var(--ui);font-weight:300;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;}
  .pg-title{font-family:var(--display);font-weight:400;font-size:clamp(34px,8.5vw,54px);line-height:1.02;margin:0;text-wrap:balance;}
  .pg-title em{font-style:italic;color:var(--gold-soft);}
  .pg-where{font-family:var(--ui);font-weight:300;font-size:12px;letter-spacing:.12em;color:var(--ink-3);margin:14px 0 0;text-transform:uppercase;line-height:1.7;}
  .kanit{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 0;
    padding:13px 16px;border:1px solid var(--gold-faint);border-radius:3px;
    background:rgba(255,255,255,.022);
  }
  .kanit figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:7px;}
  .k-box{width:54px;height:54px;background:rgba(0,0,0,.3);border:1px solid var(--gold-faint);border-radius:2px;padding:3px;}
  .k-box svg{width:100%;height:100%;display:block;}
  .kanit figcaption{font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);max-width:9ch;text-align:center;line-height:1.35;}
  .k-eq{font-family:var(--display);font-size:20px;color:var(--gold);}
  .k-score{font-family:var(--ui);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-soft);margin-left:auto;}

  .pg-body{margin:22px 0 0;display:flex;flex-direction:column;gap:15px;max-width:52ch;}
  .pg-body p{margin:0;color:var(--ink-2);}
  .pg-body p.first::first-letter{font-family:var(--display);font-size:3.1em;line-height:.86;float:left;padding:4px 10px 0 0;color:var(--gold);}
  .pg-body strong{color:var(--ink);font-weight:600;}

  .nav{display:flex;align-items:center;gap:16px;margin:32px 0 0;padding:18px 0 30px;border-top:1px solid var(--gold-faint);}
  .nav button{border:1px solid var(--gold-dim);background:transparent;border-radius:50%;width:46px;height:46px;cursor:pointer;display:grid;place-items:center;flex:none;transition:all .2s ease;}
  .nav button:hover:not(:disabled){border-color:var(--gold);background:rgba(212,168,67,.08);}
  .nav button:disabled{opacity:.24;cursor:default;}
  .nav button svg{width:15px;height:15px;stroke:var(--gold-soft);fill:none;stroke-width:1.6;}
  .dots{display:flex;gap:7px;flex-wrap:wrap;flex:1;justify-content:center;}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--gold-dim);transition:all .3s ease;}
  .dots i.on{background:var(--gold);transform:scale(1.5);}
  .pgnum{font-family:var(--ui);font-size:11px;letter-spacing:.18em;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums;}

  .summary{border-top:1px solid var(--gold-faint);margin-top:4px;padding-top:22px;display:flex;flex-direction:column;gap:10px;}
  .sum-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;font-family:var(--ui);font-size:12px;letter-spacing:.08em;color:var(--ink-3);}
  .sum-row b{font-family:var(--display);font-size:17px;letter-spacing:0;color:var(--ink);font-weight:400;}
  .end-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
  .end-actions .btn{flex:1;min-width:150px;}
  .disclaim{font-family:var(--ui);font-weight:300;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:22px 0 40px;margin:0;}

  /* ad sorusu */
  #scr-ad .shell{padding-block:clamp(44px,12vw,86px) 60px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .ad-input{
    width:min(320px,100%);margin:26px 0 0;padding:15px 18px;
    background:rgba(255,255,255,.04);border:1px solid var(--gold-dim);border-radius:2px;
    color:var(--ink);font-family:var(--display);font-size:24px;text-align:center;
    outline:none;
  }
  .ad-input::placeholder{color:var(--ink-3);font-size:17px;font-style:italic;}
  .ad-input:focus{border-color:var(--gold);background:rgba(212,168,67,.06);}

  /* fincanı çerçeveleme */
  #scr-frame .shell{padding-block:24px 44px;max-width:620px;text-align:center;}
  .framer{
    position:relative;width:100%;max-width:520px;margin:22px auto 0;
    aspect-ratio:1/1;border-radius:3px;overflow:hidden;
    border:1px solid var(--gold-faint);background:#0D0609;touch-action:none;
  }
  .framer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
  .framer canvas:active{cursor:grabbing;}
  .frame-tip{
    margin:16px auto 0;max-width:38ch;font-family:var(--ui);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);line-height:1.7;
  }

  /* tepsi eylemleri */
  .slot .acts{display:flex;gap:5px;}
  .slot .acts button{
    background:transparent;border:1px solid var(--gold-faint);border-radius:99px;
    color:var(--ink-3);font-family:var(--ui);font-size:9px;letter-spacing:.09em;
    text-transform:uppercase;padding:4px 9px;cursor:pointer;transition:all .18s ease;
  }
  .slot .acts button:hover{border-color:var(--gold);color:var(--gold-soft);}

  /* kamera */
  #scr-cam{position:fixed;inset:0;z-index:30;background:#000;}
  #scr-cam.on{display:block;}
  .camwrap{position:absolute;inset:0;display:flex;flex-direction:column;}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  .camring{
    position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    width:min(82vw,82vh);aspect-ratio:1/1;border-radius:50%;
    border:2px solid rgba(235,212,154,.85);
    box-shadow:0 0 0 100vmax rgba(8,4,6,.55);
    pointer-events:none;
  }
  .camring::after{
    content:"";position:absolute;inset:9%;border-radius:50%;
    border:1px dashed rgba(235,212,154,.32);
  }
  /* sonraki kareler serbest açıdan çekilir: halka artık kesin bir
     daire değil, "fincan buranın içinde kalsın" sınırıdır */
  .camring.serbest{ border-style:dashed; border-color:rgba(235,212,154,.6); }
  .camring.serbest::after{ display:none; }
  .camaci{
    position:absolute;left:0;right:0;top:calc(46% - min(41vw,41vh) - 34px);
    text-align:center;margin:0;padding:0 24px;
    font-family:var(--display);font-style:italic;font-size:20px;
    color:var(--gold-soft);text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  .camhint{
    position:absolute;left:0;right:0;top:calc(46% + min(41vw,41vh) + 20px);
    text-align:center;margin:0;padding:0 24px;
    font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-soft);text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  .cambar{
    position:absolute;left:0;right:0;bottom:0;
    padding:20px 26px calc(26px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .shutter{
    width:74px;height:74px;border-radius:50%;cursor:pointer;
    border:3px solid rgba(255,255,255,.9);background:rgba(235,212,154,.95);
    box-shadow:0 0 0 3px rgba(0,0,0,.35);
  }
  .shutter:active{transform:scale(.94);}
  .camx,.camspacer{
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(235,212,154,.35);
    background:rgba(8,4,6,.5);color:var(--gold-soft);font-size:15px;cursor:pointer;
    display:grid;place-items:center;
  }
  .camspacer{visibility:hidden;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--gold-soft);color:#1C0F07;padding:10px 18px;border-radius:2px;
    font-family:var(--ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    opacity:0;pointer-events:none;transition:all .3s ease;z-index:50;max-width:80vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .fade-in{animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important;transition-duration:.001s !important;} }

  /* gördüğüm · tahmin · öğret */

    margin:20px 0 0;padding:12px 16px;border-left:2px solid var(--gold-dim);

let LANG = "tr";

     2) Ölçülü uyarı ve iltifat havuzları (her fala değil, ara sıra).

  "Küçük bir not: telve burada azıcık dağınık. Bu, önümüzdeki haftalarda parayla ilgili kısa bir sıkışma anlatır. Büyük bir sorun değil, sadece beklemediğin bir masraf çıkabilir. Şimdiden bir kenara ayırırsan hiç hissetmezsin.",

PACK.tr.sym = {

yol:{ad:"Yol", hikaye:"önüne açık bir yolun çıkması",
  ogret:"Fincanda uzun ve kesintisiz her iz yoldur. Önemli olan izin kalınlığı değil, kırılmamış olmasıdır: kopuk iz engel, bütün iz açık yol demektir.",
  ana:["Şuraya bak {ad}: telve upuzun, tek parça bir iz bırakmış ve hiçbir yerde kopmamış. Fincanda bu yoldur. Başladığın ama daha bitirmediğin bir şey var ve önü kapalı değil.",
       "Burada telve kalemle çekilmiş gibi ince uzun gitmiş. Böyle izler bana hep aynı şeyi söyler {ad}: yürümeye devam ettiğin bir yol var ve tıkanmamış."],
  tahmin:["Bu yolla ilgili ilk somut adımı sen atmayacaksın, bir vesile çıkacak. Bir telefon, bir konuşma, ufak bir teklif. O geldiğinde 'işte bu' diyeceksin.",
          "Bu işin seni bugün düşündüğünden biraz daha uzağa götüreceği. Başlangıçta küçük görünen bir şey büyüyecek."],
  zon:{kenar:"İz fincanın ağzına yakın. Uzak bir gelecekten değil, önümüzdeki günlerden söz ediyoruz. Zaten aklında olan bir adım bu.",
       orta:"İz fincanın ortasında. Yakın aylarda olgunlaşacak bir gidişat. Aceleye gelmiyor ama duruyor da değil.",
       dip:"İz fincanın dibinde. Bu yolun başlangıcı çoktan atılmış. Şu an yürüdüğün yer, bir süre önce verdiğin bir kararın devamı."},
  yan:{yakin:"Yol kulbun hemen yanında, yani senin tarafında. Bu adımı kimsenin senin yerine atmasını bekleme; zaten beklemiyorsun.",
       karsi:"Yol kulbun tam karşısında. Bu gidiş seni alıştığın çevreden biraz uzaklaştıracak. Uzaklaşmak burada kaybetmek değil.",
       yan:"Yol kulbun yanından geçiyor. Yanında biri var ve bu yolda payı olacak."}},

kivrimliYol:{ad:"Dolambaçlı Yol", hikaye:"işlerin dolambaçlı ama kesintisiz ilerlemesi",
  ogret:"Kıvrılan iz ile kopan iz aynı şey değildir. Kıvrım gecikme anlatır, engel anlatmaz. Fincanda asıl kötü haber izin ortadan kesilmesidir.",
  ana:["İz düz gitmiyor {ad}, kıvrıla kıvrıla ilerliyor. Bu 'gidemiyorsun' demek değil, 'düz gidemiyorsun' demek. Telve burada senden sabır istiyor.",
       "Buradaki iz birkaç kere yön değiştirmiş ama hiç kopmamış. Fincanda bu, işin uzayacağını ama yürüyeceğini söyler."],
  tahmin:["Bu işte bir kere daha geri adım atman istenecek ve sen sinirleneceksin. O geri adım aslında yolu kısaltacak.",
          "Beklediğin cevap bir kez erteleneceki ama ikinci seferinde beklediğinden iyi gelecek."],
  zon:{kenar:"Kıvrımlar ağza yakın. Şu günlerde işler biraz dolambaçlı ilerleyecek ama ilerleyecek.",
       orta:"Kıvrımlar ortada. Süreç uzun ama kopuk değil; iz hiçbir yerde kesilmemiş.",
       dip:"Kıvrımlar dipte. Dolambaçlı kısmı çoktan geçmişsin, farkında bile değilsin."},
  yan:{yakin:"Kıvrım senin tarafında. Zorlanan sensin ama yöneten de sensin.",
       karsi:"Kıvrım karşı tarafta. Gecikme senden değil, karşıdan geliyor.",
       yan:"Kıvrım yandan geçiyor. Yanındaki biri bu süreci hem uzatıyor hem kolaylaştırıyor."}},

ayrilanYol:{ad:"Ayrılan Yol", hikaye:"bir seçimin eşiğine gelmen",
  ogret:"Tek başlayıp ikiye ayrılan iz fincanın en net işaretlerinden biridir. Kolların kalınlığına bakılır: kalın olan, kişinin zaten daha çok düşündüğü taraftır.",
  ana:["Fincandaki en açık şey bu {ad}: iz tek başlıyor ve ikiye ayrılıyor. Bir seçimin eşiğindesin. Şunu da söyleyeyim, insan bu noktaya geldiğinde cevabı çoktan bilir, sadece henüz sesli söylememiştir.",
       "Bak burada telve çatallanmış. İki ucu da açık, ikisi de yaşanabilir. Yani ortada 'doğru' ve 'yanlış' yok {ad}, iki ayrı hayat var."],
  tahmin:["Kararı bir başkasının lafı hızlandıracak. Sana yeni bir şey söylemeyecek, sadece zaten bildiğini duyunca rahatlayacaksın.",
          "Bu seçimi düşündüğünden erken vereceksin. Zorlanacağın kısım karar değil, kararı çevrene anlatmak olacak."],
  zon:{kenar:"Ayrım fincanın ağzına yakın, yani karar yakın. Haftalar meselesi.",
       orta:"Ayrım fincanın ortasında. Düşünmek için vaktin var ama sonsuz değil.",
       dip:"Ayrım fincanın dibinde. Bu ikilik yeni değil, bir süredir seninle geziyor."},
  yan:{yakin:"Ayrım senin tarafında. Karar tamamen sana ait, kimseden onay beklemene gerek yok.",
       karsi:"Ayrım kulbun karşısında. Seçeneklerden biri seni dışarıya, yeni bir çevreye açıyor.",
       yan:"Ayrım yanda duruyor. Kararında bir başkasının da payı var ama son sözü sen söyleyeceksin."},
  ek:"Fincanın tek uyarısı şu: karar vermemek de bir karardır ve iki yolu birden açık tutmaya çalışmak ikisinden de yorucudur."},

kus:{ad:"Kuş", hikaye:"yoldaki bir haberin sana ulaşması",
  ogret:"Kuş fincanın haberci işaretidir. Gövdesi dolgun, bir ucu incelip uzuyorsa haber henüz yoldadır; kuş fincanın ağzına ne kadar yakınsa haber o kadar yakındır.",
  ana:["İşte bu kuş {ad}. Bir tarafı gövde gibi toplu, öbür tarafı incelip uzamış. Fincanda kuş her zaman haberdir; hem de beklenen türden.",
       "Şu şekle dikkat et: bir uçta toplu bir gövde, diğer uçta ince bir kuyruk. Telve böyle düştüğünde orası bir kuş ve kuş haber demektir."],
  tahmin:["Bu haberin telefonla ya da yazıyla geleceği, yüz yüze değil. Ve iyi haber olacak, ama sen önce 'acaba' diyeceksin.",
          "Haber bir kişiyle ilgili olacak, bir işle değil. Uzun zamandır sesi çıkmayan birinden."],
  zon:{kenar:"Kuş ağza yakın. Haber çok yakın, günler içinde.",
       orta:"Kuş ortada. Birkaç hafta içinde, hem de beklemediğin bir yerden.",
       dip:"Kuş dipte. Aslında haber çoktan geldi, sen üstünde durmadın."},
  yan:{yakin:"Kuş senin tarafında. Haber doğrudan seni ilgilendiren bir konudan.",
       karsi:"Kuş karşı tarafta. Haberi uzaktan biri getiriyor.",
       yan:"Kuş yanda. Haberi yakınındaki biri taşıyacak."}},

balik:{ad:"Balık", hikaye:"beklemediğin bir yerden gelen bir bolluk",
  ogret:"Balık fincanın en cömert işaretidir: bereket, kısmet, akan bir kapı. Başı hangi yöne bakıyorsa bolluğun nereden geldiğini oradan okuruz.",
  ana:["Bu bir balık {ad} ve fincanda balık görmek nadirdir. Bereket demektir; hem de çalışıp hak edilen değil, denk gelen türden.",
       "Şurada bir balık var: toplu bir gövde, ucunda açılan bir kuyruk. Fincanda balık kısmettir, hep öyle okunmuştur."],
  tahmin:["Bunun parayla ilgili olduğu ama maaş gibi düzenli bir şey değil. Bir kere gelecek, beklemediğin anda gelecek.",
          "Bu bolluk bir fırsat şeklinde gelecek, para şeklinde değil. Fırsatı parayı sen çevireceksin."],
  zon:{kenar:"Balık ağza yakın, kısmet kapıda.",
       orta:"Balık ortada, birkaç ay içinde eline geçecek.",
       dip:"Balık dipte. Bu bolluğun tohumu geçmişte atılmış, şimdi karşılığını alıyorsun."},
  yan:{yakin:"Balık senin tarafında, kaynağı senin emeğin.",
       karsi:"Balık karşı tarafta, dışarıdan gelen bir kısmet.",
       yan:"Balık yanda, yakınındaki biriyle ortak bir bereket."}},

kalp:{ad:"Kalp", hikaye:"bir duygunun açığa çıkması",
  ogret:"Kalp göründüğünde konu akıl değil duygudur. Üstü açık, altı toplu bir kalp dışa dönük bir duyguyu; kapalı ve sıkışık bir kalp ise saklanan bir duyguyu anlatır.",
  ana:["Fincanda kalp göründü mü konu akıl değildir {ad}, duygudur. Bu şeklin üstü açık, altı toplu; yani duygu dışarı dönük, saklanacak gibi değil.",
       "Burada bir kalp var. Fincanda kalp her zaman aşk değildir; bazen bir yakınlık, bazen bir affetme isteğidir. Seninkinde sıcak duruyor."],
  tahmin:["İlk adımı senin atman gerekecek ve sen bunu 'karşı taraf atsın' diye erteliyorsun. Erteledikçe büyüyor.",
          "Bu duygu bir vesileyle açığa çıkacak: bir kutlama, bir tesadüf, bir yolculuk. Planlayarak olmayacak."],
  zon:{kenar:"Kalp ağza yakın. Şu günlerde canlı, sıcak bir mesele.",
       orta:"Kalp ortada. Olgunlaşan, acele etmeyen bir duygu.",
       dip:"Kalp dipte. Köklü bir bağ; yenisi değil, eskisi."},
  yan:{yakin:"Kalp senin tarafında. Duygunun sahibi sensin.",
       karsi:"Kalp karşı tarafta. Biri senin için düşünüyor ve henüz söylemedi.",
       yan:"Kalp yanda. Karşılıklı ama ikiniz de temkinlisiniz."}},

agac:{ad:"Ağaç", hikaye:"köklenmiş bir şeyin kendi kendine büyümesi",
  ogret:"Ağaç sabır işaretidir. Altta ince gövde, üstte açılan taç: kökü sağlam olan şeyin kendiliğinden büyüdüğünü söyler. Ağaç çıkan fincanda acele tavsiye edilmez.",
  ana:["Altta dar bir gövde, üstte açılan bir taç. Bu ağaç {ad}. Fincanda ağaç zamanla büyüyen şeydir: köklenmiş, artık kendi kendine genişliyor.",
       "Şekil tam bir ağaç gibi durmuş. Bu işaret bana hep şunu söyler: elini çekince bozulmayacak bir şey kurmuşsun."],
  tahmin:["Bu yıl içinde emeğinin karşılığını bir başkasının ağzından duyacaksın. Övgü gibi değil, teklif gibi gelecek.",
          "Büyüyen şey senin beklediğin dal değil, yan daldan biri olacak. Asıl meyveyi oradan alacaksın."],
  zon:{kenar:"Dallanma bu sıralar görünür olacak.",
       orta:"Bu yıl içinde belirgin biçimde büyüyecek.",
       dip:"Kökler çok eski ve sağlam."},
  yan:{yakin:"Ağacı sen diktin.",
       karsi:"Gölgesinden başkaları da faydalanıyor.",
       yan:"Aile ya da yakın çevreyle ilgili."}},

dag:{ad:"Dağ", hikaye:"önündeki bir yükü aşman",
  ogret:"Dağ fincanın en dürüst şeklidir, önündeki işi asla küçültmez. Eteği geniş tepesi darsa zor kısım baştadır; tersi ise sona doğru zorlanacağın anlamına gelir.",
  ana:["Dağ fincanın en dürüst şeklidir {ad}, önündeki şeyi asla küçültmez. Ama bu dağın eteği geniş, tepesi dar: yani zor kısmı başta, yukarı çıktıkça hafifliyor.",
       "Şurada bir yükseliş var, tam bir dağ gibi. Fincanda dağ 'kolay olacak' demez, 'aşılır' der. Seninkinde tepe görünüyor, bu önemli."],
  tahmin:["Bu yükün büyük kısmı aslında beklemekten kaynaklanıyor. Başladığın gün yarısı eriyecek.",
          "Bu işte sana bir yerden destek gelecek ama istemen gerekecek. Kendiliğinden uzanan bir el görmüyorum, istenince uzanan bir el görüyorum."],
  zon:{kenar:"Dağ ağza yakın, şu sıralar uğraştığın somut bir mesele.",
       orta:"Dağ ortada. Aylara yayılan, sabır isteyen bir iş.",
       dip:"Dağ dipte. Bunu sen çoktan aştın, aştığını kendine söylemeyi unutmuşsun sadece."},
  yan:{yakin:"Dağ senin tarafında. Yükü taşıyan sensin ve taşıyabiliyorsun.",
       karsi:"Dağ karşı tarafta. Zorluk dışarıdan geliyor, senin eksiğinden değil.",
       yan:"Dağ yanda. Bu yükü paylaşabileceğin biri var, sormaktan çekiniyorsun."}},

yilan:{ad:"Yılan", hikaye:"çevrende dikkat etmen gereken bir söz",
  ogret:"Yılan fincanın uyarı işaretidir ama kötülük değil, dikkat anlatır: dolambaçlı bir söz, arkadan konuşma, ikiyüzlülük. Yılanın başı nereye bakıyorsa dikkat de oraya çevrilir.",
  ana:["Burada kıvrılarak uzayan kalın bir iz var {ad}, burada bir yılan var. Korkma, yılan fincanda kötülük değil dikkat demektir: çevrende sözü ile özü aynı olmayan biri var.",
       "Şu kıvrımlı, kalın ize bak. Fincanda bu yılandır ve genelde tek bir şeyi söyler: her duyduğun söz sana geldiği gibi söylenmemiştir."],
  tahmin:["Bu kişi uzak biri değil, oldukça yakın. Zaten içine bir şüphe düşmüş durumda; fincan sadece onu doğruluyor.",
          "Bu konu bir dedikodu şeklinde kulağına gelecek. İlk tepkini vermeden bir gün bekle, işin rengi değişir."],
  zon:{kenar:"Yılan ağza yakın, konu bu günlerde.",
       orta:"Yılan ortada, birkaç ay sürecek bir mesele.",
       dip:"Yılan dipte. Bu eski bir hesap, yeni değil."},
  yan:{yakin:"Yılan senin tarafında. Dikkat etmen gereken şey kendi çevrende.",
       karsi:"Yılan karşı tarafta. İş ya da dışarı ile ilgili, ev ile değil.",
       yan:"Yılan yanda. Ortak tanıdıklarınızdan biri."}},

ev:{ad:"Ev", hikaye:"yuvayla ilgili bir düzelme",
  ogret:"Ev fincanda yuvadır: taşınma, düzen kurma, aileyle ilgili bir karar. Çatısı belirgin bir ev sağlamlık; kenarları dağılmış bir ev ise bir düzen arayışı anlatır.",
  ana:["Bu bir ev {ad}, hem de çatısı belli. Fincanda ev yuva demektir: taşınma, düzen kurma ya da aileyle ilgili bir karar.",
       "Şekil dört köşe ve üstünde bir çatı var. Bu fincanda evdir; oturmuş bir düzenden ya da kurulacak bir düzenden söz eder."],
  tahmin:["Mesele bir mekân değişikliği. Ev, oda, hatta masa değişikliği bile olabilir; ama bir yer değişiyor.",
          "Aile içinde uzun süredir konuşulan bir konu bu sene karara bağlanacak ve beklediğinden yumuşak geçecek."],
  zon:{kenar:"Ev ağza yakın, konu şimdiki günlerde.",
       orta:"Ev ortada, bu yıl içinde netleşiyor.",
       dip:"Ev dipte. Kökler, aile, geçmişten gelen bir düzen."},
  yan:{yakin:"Ev senin tarafında, kararı sen vereceksin.",
       karsi:"Ev karşı tarafta, dışarıdan gelen bir teklif.",
       yan:"Ev yanda, aileyle ortak bir karar."}},

anahtar:{ad:"Anahtar", hikaye:"kapalı bir kapının açılması",
  ogret:"Anahtar çözüm işaretidir. Fincanda anahtar çıktığında sorulan soru 'olacak mı' değil 'ne zaman' olur; çünkü anahtar zaten kilidin açıldığını söyler.",
  ana:["Şuna bak {ad}: bir ucu halka, öbür ucu dişli. Bu anahtar. Fincanda anahtar tıkalı bir işin çözülmesidir.",
       "Bu bir anahtar. Fincanda anahtar en sevdiğim işaretlerden biridir, çünkü 'kapı var ama kilidi de var' demektir."],
  tahmin:["Çözüm beklediğin yerden değil, tam tersi bir yerden gelecek. Israr ettiğin kapı değil, kapatmaya kıyamadığın kapı açılacak.",
          "Bu çözüm bir kişinin araya girmesiyle olacak. Kendi başına uğraştığın sürece kilit dönmüyor."],
  zon:{kenar:"Anahtar ağza yakın, çözüm çok yakın.",
       orta:"Anahtar ortada, birkaç ay içinde.",
       dip:"Anahtar dipte. Çözüm aslında elinde, kullanmayı unutmuşsun."},
  yan:{yakin:"Anahtar senin tarafında, kapıyı sen açacaksın.",
       karsi:"Anahtar karşı tarafta, kapıyı biri sana açacak.",
       yan:"Anahtar yanda, birlikte açılacak bir kapı."}},

yuzuk:{ad:"Yüzük", hikaye:"yarım kalmış bir şeyin tamamlanması",
  ogret:"Kapalı halka tamamlanmadır: bir söz, bir bağ, bir dönemin düğümlenmesi. Halka kırıksa iş yarım kalır; seninkinde önce halkanın kapalı olup olmadığına bakılır.",
  ana:["Halka kapanmış {ad}. Fincanda kapalı halka tamamlanan bir şeydir: bir söz, bir bağ, bir dönemin düğümlenmesi.",
       "Şurada ortası boş, kenarı tam bir halka var. Bu yüzüktür ve fincanda yüzük hep 'sözleşme' anlamına gelir; nikâh da olabilir, anlaşma da."],
  tahmin:["Bu söz yazıyla değil konuşmayla verilecek, ama bağlayıcı olacak.",
          "Tamamlanan şey seni rahatlatacak ama aynı zamanda 'artık geri dönüş yok' hissi verecek. İkisi birden normaldir."],
  zon:{kenar:"Halka ağza yakın, tamamlanma çok yakın.",
       orta:"Halka ortada. Bu ay bağlanan bir iş ya da söz.",
       dip:"Halka dipte. Tamamlanan şey aslında geçmişe ait bir hesap."},
  yan:{yakin:"Halka senin tarafında, sözü veren sensin.",
       karsi:"Halka karşı tarafta, sözü sana verecekler.",
       yan:"Halka yanda, iki taraflı bir anlaşma."}},

merdiven:{ad:"Merdiven", hikaye:"basamak basamak bir yükseliş",
  ogret:"Merdiven fincanda yükseliştir ama sıçrama değil: basamak basamak çıkılan bir yol. Basamaklar ne kadar düzgünse yükseliş o kadar sağlamdır.",
  ana:["Şu basamaklı ize bak {ad}. Fincanda merdiven yükseliştir; ama bir anda değil, adım adım.",
       "Bu şekil merdiven gibi kademeli çıkıyor. Telve böyle düştüğünde iş ilerliyor demektir, hem de sağlam biçimde."],
  tahmin:["Bu yükselişin ilk basamağı zaten çıkıldı, sen onu basamak saymadın.",
          "Bu yıl içinde konumun ya da sorumluluğun değişecek. Büyük bir sıçrama değil ama geri dönüşü olmayan bir adım."],
  zon:{kenar:"Merdiven ağza yakın, çıkış şimdi başlıyor.",
       orta:"Merdiven ortada, bu yıla yayılacak.",
       dip:"Merdiven dipte. Çıkışın çoktan başlamış."},
  yan:{yakin:"Merdiven senin tarafında, kendi emeğinle çıkıyorsun.",
       karsi:"Merdiven karşı tarafta, biri sana yer açıyor.",
       yan:"Merdiven yanda, destekle çıkılan bir yol."}},

yildiz:{ad:"Yıldız", hikaye:"emeğinin görünür olması",
  ogret:"Yıldız fincanın şans işaretidir ama kör talih değil: yapılan işin fark edilmesi. Kolları belirgin bir yıldız açık bir başarı, silik bir yıldız ise gecikmiş bir takdir anlatır.",
  ana:["Şurada köşeleri belli bir yıldız var {ad}. Fincanda yıldız şanstır; ama piyango gibi değil, 'emeğin görüldü' gibi.",
       "Bu şeklin kolları dışa doğru açılmış, tam bir yıldız. Telve böyle düştüğünde iyi bir şey yolda demektir."],
  tahmin:["Bu takdir bir kişiden gelecek ve o kişinin sözü senin için beklediğinden değerli olacak.",
          "Yakın zamanda bir işin sonucunu alacaksın ve kendine 'demek ki oluyormuş' diyeceksin."],
  zon:{kenar:"Yıldız ağza yakın, çok yakında.",
       orta:"Yıldız ortada, birkaç ay içinde.",
       dip:"Yıldız dipte, eski bir emeğin karşılığı."},
  yan:{yakin:"Yıldız senin tarafında, hak edilmiş bir şans.",
       karsi:"Yıldız karşı tarafta, dışarıdan gelen bir iyilik.",
       yan:"Yıldız yanda, paylaşılan bir sevinç."}},

cicek:{ad:"Çiçek", hikaye:"küçük ama gerçek bir sevinç",
  ogret:"Çiçek müjde işaretidir. Fincanda çiçek büyük olaylardan değil, insanı iyi hissettiren küçük şeylerden söz eder: bir davet, bir hediye, bir haber.",
  ana:["Bu çiçek {ad}: ortada bir göbek, etrafında açılan yapraklar. Fincanda çiçek küçük ama gerçek bir sevinçtir.",
       "Şeklin etrafı yaprak yaprak açılmış. Burada bir çiçek var ve çiçek fincanda hep müjdedir."],
  tahmin:["Bir davet ya da kutlama var yolda. Senin için değil ama seni mutlu edecek.",
          "Yakın zamanda küçük bir hediye ya da beklenmedik bir jest alacaksın. Değeri fiyatında olmayacak."],
  zon:{kenar:"Çiçek ağza yakın, günler içinde.",
       orta:"Çiçek ortada, birkaç hafta içinde.",
       dip:"Çiçek dipte, eski bir dostluktan geliyor."},
  yan:{yakin:"Çiçek senin tarafında, sevinç doğrudan senin.",
       karsi:"Çiçek karşı tarafta, uzaktan geliyor.",
       yan:"Çiçek yanda, yakınından biri getiriyor."}},

atnali:{ad:"At Nalı", hikaye:"kıl payı atlatılan bir iş",
  ogret:"At nalı korunma işaretidir. Fincanda çıktığında genelde 'ucuz atlattın' ya da 'atlatacaksın' anlamına gelir. Açık ucu yukarı bakıyorsa şans devam ediyor demektir.",
  ana:["Bu bir at nalı {ad}: bir ucu açık, gövdesi kavisli. Fincanda at nalı korunmadır, kıl payı atlatılan bir iş.",
       "Şekil tam nal gibi kıvrılmış. Telvede bunu görünce içim rahatlar, çünkü nal hep koruma anlatır."],
  tahmin:["Son zamanlarda bir şeyi ucuz atlattın ama farkına varmadın. Fincan onu senin yerine not etmiş.",
          "Yaklaşan küçük bir aksilik seni teğet geçecek. Hazırlıklı olman yeter, korkman gerekmiyor."],
  zon:{kenar:"Nal ağza yakın, koruma şu günlerde.",
       orta:"Nal ortada, önümüzdeki aylar için.",
       dip:"Nal dipte, geçmişte atlatılmış bir iş."},
  yan:{yakin:"Nal senin tarafında, kendini sen korudun.",
       karsi:"Nal karşı tarafta, dışarıdan bir koruma.",
       yan:"Nal yanda, biri seni kolladı."}},

kelebek:{ad:"Kelebek", hikaye:"bir dönemin kabuk değiştirmesi",
  ogret:"Kelebek değişim işaretidir ve fincanda değişim genelde iyidir: eski hâlin kabuğunu bırakmak. Kanatlar simetrikse değişim dengelidir.",
  ana:["Şurada iki yana açılmış, simetrik bir şekil var {ad}. Burada bir kelebek var: bir dönemin kabuğunu bırakıyorsun.",
       "Bu şekil ortadan ikiye ayrılıyor ve iki yanı da açılıyor. Fincanda kelebek değişimdir, hem de hafifleyerek olan bir değişim."],
  tahmin:["Bu değişim dışarıdan küçük görünecek ama senin içinde büyük olacak. Kimse fark etmeyebilir.",
          "Bu sene alışkanlıklarından birini bırakacaksın ve şaşıracaksın, çünkü zor sandığın şey kolay olacak."],
  zon:{kenar:"Kelebek ağza yakın, değişim başlamış bile.",
       orta:"Kelebek ortada, birkaç ay sürecek.",
       dip:"Kelebek dipte, uzun süredir olgunlaşan bir değişim."},
  yan:{yakin:"Kelebek senin tarafında, değişen sensin.",
       karsi:"Kelebek karşı tarafta, çevren değişiyor.",
       yan:"Kelebek yanda, birlikte değişiyorsunuz."}},

gemi:{ad:"Gemi", hikaye:"uzaktan gelen ya da uzağa giden bir şey",
  ogret:"Gemi uzaklık işaretidir: yolculuk, gurbet, uzaktan gelen haber ya da kişi. Yelkeni doluysa iş yürüyor; yelkeni inikse beklemek gerekir.",
  ana:["Bu bir gemi {ad}: altta gövde, üstte yelken. Fincanda gemi uzaklıktır; ya bir yolculuk ya uzaktan bir haber.",
       "Şeklin altı düz, üstü sivri bir yelken gibi. Telvede bu gemidir ve gemi hep mesafeden söz eder."],
  tahmin:["Bu bir yurt dışı ya da şehir dışı meselesi. Senin gitmen şart değil, bir şeyin gelmesi de olabilir.",
          "Uzakta olan biriyle yeniden bağ kuracaksın. Araya zaman girmiş ama kopmamış bir bağ."],
  zon:{kenar:"Gemi ağza yakın, yola çıkma zamanı yakın.",
       orta:"Gemi ortada, birkaç ay içinde.",
       dip:"Gemi dipte, eski bir bağ uzaklardan geri geliyor."},
  yan:{yakin:"Gemi senin tarafında, giden sensin.",
       karsi:"Gemi karşı tarafta, gelen var.",
       yan:"Gemi yanda, birlikte çıkılan bir yol."}},

ok:{ad:"Ok", hikaye:"bir konuya nihayet yönelmen",
  ogret:"Ok yön işaretidir: dağınık bir konuya karar verip yönelmek. Ucu kulba bakıyorsa yönelme kişinin kendinedir, karşıya bakıyorsa dışarıya.",
  ana:["Şurada uçlu, tek yöne giden bir iz var {ad}. Bu ok. Fincanda ok 'artık karar verdin' demektir.",
       "Bu şekil bir yöne sivriliyor. Telvede ok hedeftir: dağılan enerjinin tek bir yere toplanması."],
  tahmin:["Bu yönelme bir vazgeçişle birlikte gelecek. Bir şeyi bırakmadan buna sıra gelmiyor.",
          "Kısa sürede bir işe ağırlık vereceksin ve diğerlerini bilinçli olarak erteleyeceksin. Doğru olan da bu."],
  zon:{kenar:"Ok ağza yakın, yönelme şimdi.",
       orta:"Ok ortada, birkaç ay içinde netleşiyor.",
       dip:"Ok dipte, yönünü çoktan seçmişsin."},
  yan:{yakin:"Ok senin tarafında, hedefi sen koydun.",
       karsi:"Ok karşı tarafta, dışarıya yönelen bir enerji.",
       yan:"Ok yanda, ortak bir hedef."}},

ay:{ad:"Hilal", hikaye:"bir şeyin tam vaktine gelmesi",
  ogret:"Ay olgunlaşmadır. Dolunay 'vakti geldi', hilal ise 'büyüyor, bekle' der. Fincanda ay çıkması acele etmemek gerektiğinin işaretidir.",
  ana:["Yuvarlak ama bir kenarı yenmiş: burada bir hilal var {ad}. Fincanda ay olgunlaşmadır, henüz dolmamış ama doluyor.",
       "Şu kavisli, içi boş şekle bak. Fincanda ay zamanı anlatır: bir şey büyüyor ve vakti yaklaşıyor."],
  tahmin:["Beklediğin şey olacak ama senin koyduğun tarihte olmayacak. Biraz sonra, biraz daha iyi olacak.",
          "Bu konuda acele eden taraf sen olma. Beklersen elindeki büyüyecek."],
  zon:{kenar:"Vakti gelen şey hemen önünde.",
       orta:"Önümüzdeki aylarda tam olgunluğuna varacak.",
       dip:"Olgunlaşan şey geçmişten geliyor, artık toplama zamanı."},
  yan:{yakin:"Olgunlaşan şey senin emeğin.",
       karsi:"Olgunlaşan şey dışarıdan geliyor.",
       yan:"Emek paylaşılmış."}},

hac:{ad:"Kavşak", hikaye:"iki konunun aynı noktada kesişmesi",
  ogret:"Kesişen iki çizgi fincanda kavşaktır: iki ayrı konunun aynı anda karşına çıkması. Kötü bir işaret değildir, sadece aynı anda iki şeye bakman gerektiğini söyler.",
  ana:["İki iz burada birbirini kesiyor {ad}. Fincanda bu kavşaktır: iki ayrı konu aynı noktada buluşuyor.",
       "Şurada çapraz bir kesişme var. Telvede bu, iki işin aynı haftaya denk gelmesi gibi okunur."],
  tahmin:["İki konudan birini erteleyeceksin ve doğru olanı erteleyeceksin. İçgüdün burada iyi çalışıyor.",
          "Bu kesişme bir tesadüf gibi görünecek ama sonradan 'iyi ki öyle oldu' diyeceksin."],
  zon:{kenar:"Kavşak ağza yakın, bu haftalarda.",
       orta:"Kavşak ortada, birkaç ay içinde.",
       dip:"Kavşak dipte, eski iki konu birleşiyor."},
  yan:{yakin:"Kavşak senin tarafında, ikisi de senin meselen.",
       karsi:"Kavşak karşı tarafta, dışarıdan gelen iki iş.",
       yan:"Kavşak yanda, biri seninle ilgili biri yakınınla."}},

damla:{ad:"Damla", hikaye:"içinde biriken bir şeyin boşalması",
  ogret:"Damla fincanda birikmiş duygudur. Kötü bir işaret değildir; tersine boşalmayı, hafiflemeyi anlatır. Tek damla geçici, çok damla uzun süredir tutulan bir şeydir.",
  ana:["Üstü sivri, altı toplu bir şekil: bu damla {ad}. Fincanda damla birikmiş bir duygunun boşalmasıdır. Korkma, boşalmak iyidir.",
       "Şurada aşağı doğru toplanan bir iz var. Telvede burada bir damla var ve genelde 'içinde tuttuğun bir şey var' anlamına gelir."],
  tahmin:["Bunu bir konuşma çözecek. Hem de hiç planlamadığın bir anda, hiç beklemediğin biriyle.",
          "Son zamanlarda kendini fazla tuttun. Yakında bir vesileyle boşalacak ve sonrasında çok hafifleyeceksin."],
  zon:{kenar:"Damla ağza yakın, bu günlerde.",
       orta:"Damla ortada, birkaç ay içinde.",
       dip:"Damla dipte, uzun süredir tutulan bir şey."},
  yan:{yakin:"Damla senin tarafında, biriktiren sensin.",
       karsi:"Damla karşı tarafta, dışarıdan gelen bir hüzün.",
       yan:"Damla yanda, paylaşılan bir duygu."}},

zincir:{ad:"İki Halka", hikaye:"iki tarafın birbirine bağlanması",
  ogret:"Yan yana iki boşluk fincanda ortaklıktır: iki kişi, iki iş ya da iki dönem. Halkalar aynı hizadaysa bağ dengeli, biri diğerinden büyükse taraflardan biri daha çok veriyordur.",
  ana:["Telve iki ayrı boşluk bırakmış {ad}. İki halka fincanda ortaklıktır: iki kişinin, iki işin ya da iki dönemin birbirine bağlanması.",
       "Şurada yan yana iki açıklık var. Fincanda bu bağdır; halkalar ayrı ama aynı hizada duruyor, yani ortaklık dengeli."],
  tahmin:["Bu ortaklık resmî bir şeye dönüşecek. Şu an sözle yürüyen bir iş yazıya geçecek.",
          "İki taraftan biri diğerinden daha hevesli ve bu sen değilsin. Acele etmemen iyi olur."],
  zon:{kenar:"Bağ yakın zamanda kuruluyor.", orta:"Bağ birkaç ay içinde netleşiyor.", dip:"Bu bağ eski ve hâlâ duruyor."},
  yan:{yakin:"Bağın merkezinde sen varsın.", karsi:"Bağ dışarıdan kuruluyor.", yan:"Bağ yanındaki biriyle."}},

goz:{ad:"Göz", hikaye:"birinin seni uzaktan düşünmesi",
  ogret:"Uzun ve ortası boş bir iz fincanda gözdür: farkındalık. Ya biri seni düşünüyordur ya da senin gözünden kaçan bir ayrıntı vardır. Kulba yakınsa ayrıntı kendi işindedir.",
  ana:["Uzun ve ortası boş. Fincanda göz farkındalıktır {ad}: ya biri seni düşünüyor ya da bir konuda gözünden kaçan bir ayrıntı var.",
       "Şurada ortası açık, uzunca bir iz duruyor. Telvede burada bir göz var; 'birileri bakıyor' anlamına gelir, kötü niyetli olması şart değil."],
  tahmin:["Adın bir yerde geçti ve sen duymadın. İyi anlamda geçti.",
          "Bir sözleşmeyi ya da mesajı dikkatli okumadan onayladın. Bir daha bakmakta fayda var."],
  zon:{kenar:"Şu günlerde adın bir yerde geçiyor.",
       orta:"Bir süredir uzaktan takip ediliyorsun, kötü niyetli değil.",
       dip:"Eski bir tanıdık aklından geçiriyor."},
  yan:{yakin:"Gözünden kaçan şey kendi işinde.",
       karsi:"Dikkat etmen gereken şey dışarıda.",
       yan:"Yakınındaki biri sana bir şey söylemek istiyor."}},

para:{ad:"Bereket Benekleri", hikaye:"damla damla ama kesilmeyen bir akış",
  ogret:"Küçük, yuvarlak ve bir arada duran benekler fincanda bereket sayılır. Tek seferlik büyük bir gelir değil, kesilmeyen küçük bir akış anlatırlar.",
  ana:["Küçük, yuvarlak ve bir arada duruyorlar. Fincanda böyle benekler berekettir {ad}. Tek seferde gelen büyük bir şey değil, damla damla ama kesilmeyen bir akış.",
       "Şurada minik minik toplanmış bir küme var. Telvede bu bereket sayılır; azar azar gelen, ama süren bir gelir."],
  tahmin:["Bu akış bir ek işten ya da yan gelirden olacak, ana işinden değil.",
          "Gelen para gittiği gibi gelmeyecek; bu sefer bir kısmı elinde kalacak."],
  zon:{kenar:"Akış şu günlerde başlıyor.", orta:"Akış birkaç ay sürecek.", dip:"Akış zaten sürüyor, farkında olmadığın bir düzen var."},
  yan:{yakin:"Kaynağı senin emeğin.", karsi:"Kaynağı dışarıdan, beklemediğin bir yerden.", yan:"Kaynağı yakınındaki biriyle ortak."}},

bulut:{ad:"Bulut", hikaye:"geçici bir belirsizliğin dağılması",
  ogret:"Kenarları belirsiz, dağılmış telve fincanda buluttur: belirsizlik. Bulutun huyu durmamaktır, bu yüzden engel değil bekleme hâli sayılır.",
  ana:["Telve burada dağılmış, kenarları net değil. Fincanda bulut belirsizliktir {ad}. Ama bulutun bir huyu vardır: durmaz. Bu bir engelden çok bir bekleme hâli.",
       "Şurası puslu kalmış, keskin bir sınırı yok. Telve böyle olduğunda konunun henüz netleşmediğini söylerim; netleşmemesi kötü olduğu anlamına gelmez."],
  tahmin:["Netleşmesi için birine soru sorman gerekecek ve sen sormaktan çekiniyorsun. Sorduğun gün dağılacak.",
          "Bu belirsizlik bir haberle bitecek, bir kararla değil. Yani senden bir şey yapman istenmiyor, beklemen isteniyor."],
  zon:{kenar:"Belirsizlik şu anki, kısa sürecek.", orta:"Netleşmesi birkaç ay alacak.", dip:"Belirsizlik eski bir konudan kalma."},
  yan:{yakin:"Kafa karışıklığı senin içinde. Dışarıda her şey aslında net.",
       karsi:"Bilgi eksikliği karşı taraftan. Sormaktan çekinme.",
       yan:"Yanındaki biri de aynı belirsizliğin içinde."}},

iz:{ad:"İsimsiz İz", hikaye:"üstünde durduğun bir konunun ağırlığı",
  ogret:"Her iz bir hayvana ya da eşyaya benzemez. Kimi iz sadece ağırlıktır ve ağırlık da okunur: nerede durduğu zamanı, koyuluğu da önemini söyler.",
  ana:["Şurada bir gölge var {ad}. Fincanın bu köşesinde bir ağırlık var; adı konmamış ama yeri belli.",
       "Burada telve kendi içine kapanmış {ad}. Böyle izler eşyaya benzemez, hisse benzer: üstünde durduğun ama henüz adını koymadığın bir konu."],
  tahmin:["Bu konuyu zaten biliyorsun ve adını koymadığın için ertelemişsin. Adını koyduğun gün küçülecek.",
          "Bu ağırlık bir kişiyle değil, bir kararla ilgili. Karar verilince yeri boşalacak."],
  zon:{kenar:"Konu güncel, bu haftanın meselesi.", orta:"Konu birkaç aya yayılıyor.", dip:"Konu eski ve hâlâ kapanmamış."},
  yan:{yakin:"Mesele doğrudan seninle ilgili.", karsi:"Mesele dışarıdan, seni dolaylı ilgilendiriyor.", yan:"Mesele yakın çevrenle ilgili."}}
};

/* telvenin bıraktığı boşluklar */
PACK.tr.symAk = {
akYol:{ad:"Aydınlık Yol", hikaye:"telvenin arasından temiz bir geçidin açılması",
  ogret:"Boşluk okuması fincanın ikinci yarısıdır. Telvenin arasında uzanan temiz bir şerit, kalabalığın içinden açılan bir geçit sayılır.",
  ana:["Şimdi telveye değil, telvenin bıraktığı boşluğa bak {ad}. Burada porselen upuzun, temiz bir şerit hâlinde kalmış. Fincanda böyle bir açıklık geçittir.",
       "Bir de şuna bak: koyuluğun ortasından tertemiz bir şerit geçiyor. Fal yalnız telveden okunmaz {ad}, telvenin dokunmadığı yerden de okunur."],
  tahmin:["Bu geçit bir 'hayır' demekle açılacak. Bir şeyi reddettiğin gün yol açılacak.",
          "Çıkış yolu zaten görünüyor, sen daha zor olanı denemekte ısrar ediyorsun."],
  zon:{kenar:"Geçit ağza yakın, yakında kullanacaksın.", orta:"Geçit ortada, birkaç ay içinde açılıyor.", dip:"Geçit dipte, aslında bir süredir açık."},
  yan:{yakin:"Geçit senin tarafında, kendi açtığın bir yol.", karsi:"Geçit karşı taraftan, biri sana yer açıyor.", yan:"Geçit yandan, bir yakının sayesinde."}},

akAlan:{ad:"Açıklık", hikaye:"üstünden bir yükün kalkması",
  ogret:"Geniş ve temiz kalan bir alan rahatlamadır. Fincanın çok dolu olması her zaman iyi değildir; boşluk nefes alacak yer demektir.",
  ana:["Burası tamamen boş kalmış {ad}, telve hiç tutmamış. Fincanda geniş bir açıklık rahatlamadır: uzun süredir seni meşgul eden bir şeyin yerinden kalkması.",

  tahmin:["Bu yük kalktığında ilk hissedeceğin şey sevinç değil, tuhaf bir boşluk olacak. Normaldir, birkaç gün sürer.",
          "Rahatlama bir kişinin hayatından çıkmasıyla değil, bir işin kapanmasıyla gelecek."],
  zon:{kenar:"Rahatlama çok yakın.", orta:"Yük birkaç ay içinde kalkıyor.", dip:"O yük zaten kalktı, sen hâlâ taşıdığını sanıyorsun."},
  yan:{yakin:"Rahatlayan sensin.", karsi:"Rahatlama dışarıdan gelen bir haberle.", yan:"Rahatlayan yalnız sen değilsin."}},

akNokta:{ad:"Işık", hikaye:"kapalı görünen bir konunun içinde bir açıklık",
  ogret:"Koyuluğun ortasındaki küçük temiz boşluk fincanda ışıktır: kapalı görünen bir konunun içindeki gerçek ama küçük açıklık.",
  ana:["Koyuluğun tam ortasında küçük, tertemiz bir boşluk var. Fincanda bu ışıktır {ad}: kapalı görünen bir konunun içinde küçük ama gerçek bir açıklık.",
       "Şu minik boşluğa dikkat et. Etrafı kapkara ama orası temiz kalmış. Telve böyle bir şey bıraktığında orada bir ışık var."],
  tahmin:["Bu açıklığı sen değil, konuştuğun biri gösterecek. Anlatmadığın sürece kimse gösteremez.",
          "Çözüm sandığından basit ve tam da gözden kaçırdığın yerde duruyor."],
  zon:{kenar:"Bu açıklık şu günlerde belirecek.", orta:"Birkaç ay içinde göreceksin.", dip:"Bu açıklık hep oradaydı."},
  yan:{yakin:"Açıklığı sen bulacaksın.", karsi:"Açıklığı biri sana gösterecek.", yan:"Yanındaki biriyle birlikte göreceksiniz."}}
};

PACK.en.aiSoru = function(p){
  return [
"You have been reading coffee cups for thirty years. You are turning this person's cup in your hand and talking to them, sitting across from them. You are speaking, not writing an essay. Answer ONLY with valid JSON.",
"",
"WHAT YOU ARE GIVEN: " + p.foto + " photograph(s), all of the inside of the SAME cup. Everything outside the ellipse has been painted black.",
"",
"ABSOLUTE RULES",
"1) Say nothing about the black area. There is no handle, saucer, table, lace, hand, background or cup pattern. A coffee reading consists of the cup and nothing else; interpret only the grounds inside it.",
"2) LOOK FOR SHAPES. This is the heart of the reading. Do not look at a whole mass and ask what it resembles; a reader never does that. Look at its EDGE: one bulge is an elephant's trunk, one bay is a human profile, one corner is a bird's wing. Shrink what you look at, shift it a little, turn the cup in your head. The shape is almost always in a part, not in the whole.",
"3) ONE MASS CAN HOLD SEVERAL SHAPES. Inside a single mass you may find both an elephant and a person; they do not contradict each other, so write both. A shape need not account for the whole mass. If two shapes sit in two different corners of the same mass, give each its own box enclosing only that corner.",
"4) Still, never claim what you do not see. If a region truly has no edge resembling anything, set \"kesin\": false and read it by position. But do not use that as the easy way out: most of the reading should be named shapes, with at most one unnamed mark.",
"5) You are NOT required to find a letter or a number. If no mark clearly resembles one, write \"harf\": null and \"sayi\": null.",
"6) A BOX IS REQUIRED FOR EVERY SHAPE. Never write a shape without one; the app then marks nothing on that page. For every shape give its location as \"kutu\": [x0,y0,x1,y1], values from 0 to 1, 0,0 top-left, 1,1 bottom-right. The box must actually enclose that mark: the app draws it on the photograph to show the person exactly where you saw it. A wrong box is as bad as a wrong reading.",
"7) Put the photograph index in \"foto\" (1 to " + p.foto + ").",
"",
p.gecmis ? "THIS PERSON'S EARLIER READINGS\nThey have had cups read before. Shapes from those readings, oldest first:\n" + p.gecmis + "\nRefer to it in a sentence or two: we spoke of this last time, today it sits differently. If the same shape returns, say the matter continues; if it is gone, say it closed.\n" : "",
sozlukIstem() ,
p.parca ? "FIGURES THE DEVICE FOUND INSIDE THE MASSES\nThe app slid windows along the edges of the masses looking for silhouettes and found these. Treat them as starting points: look at that box, and if it genuinely resembles the thing, name it and use its box. If it does not, write the shape you see instead; you are not bound to this list.\n" + p.parca + "\n" : "",
p.dokum ? "MARKS THE DEVICE MEASURED\nThe app has already measured the clusters of grounds in this cup. Use the list below: wherever you can, pick the marks you talk about from these clusters and take their boxes from here, so the highlight lands exactly on the mark. If a measurement contradicts what you see, trust your eyes.\n" + p.dokum + "\nA darkness near 10 means a heavy, dark mark; near 3 means faint. An elongation near 1 is round; above 3 is a long mark.\n" : "",
"",
"WHERE SHAPES ARE (learned from real readings)",
"",
"- Mention the earlier reading ONCE only, in the opening. Never return to it on later pages; comparing in every sentence pulls the reading away from today.",
"LOOK AT EVERY PART OF THE CUP",
"- Do not take all your shapes from the SAME CORNER. Find shapes near the rim, in the middle and at the bottom; on the handle side, opposite it and at the sides. The cup is a whole; digging at one spot is not a reading.",
"- NEVER GIVE ONE MARK TWO NAMES. You name a mark once and never return to it. If two shapes have overlapping boxes, one of them is redundant.",
"- Leave no clear cluster of grounds uncommented. Say something about every dark mass the eye picks out; skip one and the reader asks what about that one there.",
"- LOOK AT THE NEIGHBOUR. After naming a shape, look at what sits beside, below or above it and join the two: there is a road right under the bird, so the news arrives with a journey; a ring sits above the heart, so this feeling turns into a spoken promise. That is how a cup speaks; listing shapes one by one is not a reading.",
"THE PHOTOGRAPH IS TAKEN FROM ABOVE",
"- You are looking DOWN into the cup. The rim reads as a circle, the walls are foreshortened, the bottom sits in the middle. This angle stretches and flattens the marks.",
"- So never write things like straight line, opening, gap, band, shadow or stain. Those are not shapes, they are artefacts of the overhead view and they tell the reader nothing.",
"- Do not mistake the rim circle, the shadow at the edge, the shine on the porcelain or the ring the coffee left for a shape. Those are the cup itself.",
"- Everything you name must be AN OBJECT: a bird, a hand, a ring, a tree, a road, a heart, a fish, a person, a door. A longish mark is not a name.",
"- GO FOR WHAT IS OBVIOUS. Read the dark, large marks the eye picks out at once. Do not hunt for faint or tiny ones; chasing the hard mark while easy ones sit there weakens the reading. Start with the one the device marks EN BELİRGİN.",
"- NEVER call a faint mark a shape. If a mark is hard to make out in the photograph, the reader cannot make it out either.",
"- NEVER PLACE A SHAPE WHERE THERE ARE NO GROUNDS. The box you give must actually contain dark grounds. Do not name bare porcelain, a highlight or a shadow. The app measures every box and drops any shape whose box holds no grounds, so it would be wasted.",
"- WHITE RULE: build the reading on the DARK grounds. Never read a clean white area as a shape. Read a white spot ONLY when it is SURROUNDED BY GROUNDS, that is a gap left inside the darkness. The empty half of the cup, the clean wall and the shiny bottom are never interpreted.",
"- Do not count tiny faint marks as shapes. Never name a mark too small for the person to find in their own cup; speak about marks the eye picks out.",
"- The INSIDE of a thick mass says nothing; its EDGE speaks. Bulges and bays along the outline give figures.",
"- The thin brown marks on the cup wall are the richest ground: a person, an animal, a script is usually there.",
"- The WHITE gaps the grounds leave are shapes too. A clean piece inside the dark is a figure as much as the dark is.",
"- The same shape may appear several times; write each one separately, since repetition underlines its subject.",
"- Name it descriptively, not in one word: 'a man with jug ears', 'a man holding a stick', 'a ragged coastline', 'a pregnant animal'. Names like that let the person find the shape.",
"- Numbers and letters are shapes too: if a mark truly stands like a 3, a 9 or a V, write it as a shape.",
"",
"HOW A CUP IS READ (use this, and TEACH it in the \"ogret\" field)",
"- Near the rim (\"kenar\"): near time, days and weeks.",
"- Middle of the cup (\"orta\"): matters ripening within months.",
"- Bottom (\"dip\"): the past, roots, long-running matters. A single thick mass at the bottom is a heavy subject long dwelt on, or a decision still waiting.",
"- Handle side (\"yakin\"): the person, their home, their closest circle.",
"- Opposite the handle (\"karsi\"): the outside, distance, strangers, what arrives.",
"- In between (\"yan\"): the person together with somebody else.",
"- Thickness is the weight of the matter. Thin lines running down the wall read as news, a phone call, a conversation. Small scattered specks near the rim are small sums of money or small pieces of news arriving.",
"- The clean white gaps the grounds leave are read too, usually well: opening, relief, a way out. A wide white area right beside a dark mass means relief after a tight stretch.",
"The handle in this cup points: " + p.kulp + ". Fill the region and side fields accordingly.",
"",
"",
"A PERSON IS READING, NOT A PROGRAM",
"Whoever reads this must feel a person is holding their cup. Never use a word that gives away an app or an AI.",
"- Write it flowing. Let sentences chase each other, never a bulleted list. At the end of a paragraph the reader should think, and then?",
"- Excite them. When you see something, be surprised first and explain second: Oh, look at this. I stopped when I saw that. This is the loveliest part of your cup.",
"- Think out loud now and then: Let me turn it a little. Hold on, there is one more thing.",
"- Write as if the cup is in your hand: you turn it, hold it to the light, lean in.",
"- Use everyday speech. A homemaker is reading this: process, dynamic, potential, energy, analysis are BANNED words.",
"- Give concrete examples. A new door opens is not enough; say is it a new job, a new house, or news of a wedding, let us see.",
"- Ask a question now and then: Is a move on your mind? Did you fall out with someone lately? Expect no answer; the question itself pulls the reader in.",
"- Tie the shapes together. Refer back: remember that bird we saw, this is its continuation.",
"- Close by making them feel good and INVITE THEM BACK TOMORROW: let us look again tomorrow and follow what changes. Then wish them health and happiness. Never end in a way that suggests there is no point looking again.",
"",
"VOICE: THE MOST IMPORTANT PART",
"- NEVER ANNOUNCE WHAT YOU COULD NOT DO. Sentences like 'no letter appeared', 'I could not liken it', 'I will not invent', 'I could not see' are BANNED. If something is absent, say nothing about it; a reader does not advertise gaps.",
"",
"STATE OF MIND AND WHAT PEOPLE SAY: A READING FAILS WITHOUT THESE",
"- Make a DEFINITE statement about how the person feels right now: your heart feels tight, you carry a tiredness you told nobody about, your patience has thinned. This is where people believe most. Do not ask; state it.",
"- Say what people around them have been saying, also DEFINITELY: your name came up and someone defended you, two people spoke of you. Never perhaps, never maybe.",
"- Fold these into the life headings; do not open a separate section.",
"",
"IF YOU CANNOT LIKEN IT, INVENT",
"- If a mark resists naming, pick the nearest thing and state it as fact. This is a fortune; nobody expects a laboratory report.",
"- Saying you could not liken it is banned. Every mark gets a name.",
"- If it resembles a symbol in the dictionary, say plainly that it is that symbol: this is a key, there is a ring here. Not it felt like a key to me.",
"- Touch the feelings that sit heaviest in people: indecision, regret, shyness, excitement, fear, haste, guilt, longing, stubbornness, the fatigue of waiting. This is where a reading lands hardest. Pick one and state it DEFINITELY. Never perhaps.",
"- Now and then, not every time, say this too: the person is good-hearted but not everyone is as clean-hearted as they are. Protective in tone, never accusing.",
"- Never build the same sentence twice. Even for the same feeling, change the words; the reader must not feel repetition.",
"- SPEAK WITH CERTAINTY. \"My guess\", \"I think\", \"perhaps\", \"it seems\" are BANNED. A reader does not hesitate: say \"it will come\", \"you will see\", \"it happens\". Not one hedge anywhere.",
"- Read in this order: the overall flow of the cup first, then its regions, then individual shapes last. Never fixate on a single shape.",
"- Address the person directly. Their name: " + p.ad + ". Use the name two or three times in the whole reading, not in every sentence.",
"- Write as speech. Mix short and long sentences. Break in now and then: 'Look here', 'Hold on', 'Now here is the interesting part'. No textbook tone.",
"- For each shape write four things, in order:",
"  \"gordugum\": Describe exactly what you are looking at. Where it sits, how large, how dark, which way it stretches. 2-3 sentences.",
"  \"yorum\": The reading itself. 4-6 sentences, one flowing paragraph. Say why you read it that way and what it corresponds to in their life.",
"  \"ogret\": The rule you used to read it. 2-3 sentences.",
"  \"tahmin\": A concrete expectation. 2-3 sentences. Say what, from where, roughly when, and how it arrives.",
"- Be broadly POSITIVE. For credibility include AT MOST ONE small caution (\"uyari\"): a minor health matter, a short money squeeze, or a tiring stretch. NEVER predict serious illness, death, accident, separation or ruin.",
"- Now and then pay one sincere compliment (\"iltifat\", AT MOST ONE per reading).",
"",
"LIFE HEADINGS: WHAT PEOPLE ACTUALLY WAIT FOR",
"People want to hear their cup as the headings of their life, not as a list of shapes. Fill the \"alanlar\" array with: work and money, love, a person around them, the road ahead, health and energy.",
"For each heading:",
"  \"metin\": a flowing paragraph of 4-7 sentences. What you see in the cup about this heading and what it means. Be concrete about what may happen soon.",
"  \"dayanak\": one sentence naming WHICH mark in the cup this reading rests on. Never leave it empty.",
"  Where you can, also give \"foto\" and \"kutu\" so the app can mark that spot on the photograph.",
"If a heading has nothing real to say, leave it out of the array entirely rather than padding it. If love is weak in this cup, say so plainly.",
"",
"TIMING",
"In \"zaman\" give a rhythm from the cup: a number and a unit (day, week, month). If a mark genuinely resembles a digit, use it; otherwise derive a rhythm from the count of distinct marks or how the grounds spread, and say so honestly. Give duration, not a date.",
"",
"CRUCIAL: NO GENERIC SENTENCES",
"Run every sentence through this filter: 'Could I write this same sentence for somebody else's cup?' If yes, delete it and write one tied to what you see in THIS cup.",
"Banned formulas: 'a new chapter is opening', 'listen to your inner voice', 'change is at the door', 'everything is in your hands', 'the universe is sending you a sign'.",
"Do not leave the shapes unrelated: if you see a relationship between two of them, say so.",
p.eksik ? "- You were given " + p.foto + " photograph(s). Never mention this and never complain of a gap. Interpret what you see fully, and write as if the reading were complete." : "- All three angles are present, so the reading is complete. If you see the same mark in more than one photograph, say so; a repeated mark underlines its matter.",
"",
"OUTPUT SHAPE (exactly these fields, nothing else)",
"{",
'  "yogunluk": "acik" | "denge" | "yogun",',
'  "baslik": "a 2-4 word title for the cover, specific to this cup",',
'  "giris": "what I saw when I first picked up the cup, 4-6 sentences",',

"  ],",

'  "iltifat": null,',
'  "kapanis": "a 4-6 sentence closing that ties it together",',
'  "ozet": ["short line", "short line", "short line"]',
"}",
"",
"Give 10 to 16 entries in \"sekiller\". A real reader finds fifteen shapes in one cup; so should you. At most one may be \"kesin\": false.",
"Write \"birim\" as one of: gun, hafta, ay."
  ].filter(Boolean).join("\n");
};
